            const float FX_SWING = fx_swing();
            const double t1 = fx_wobble(T, 4.0, 2.0, 0.09090909090909091, 0.0);
            const double t2 = fx_wobble(T, 3.0, 1.5, 0.06666666666666667, 1.0);
            const double t3 = fx_wobble(T, 2.0, 1.0, 0.05263157894736842, 2.0);
            const double t4 = fx_wobble(T, 1.2, 0.6, 0.043478260869565216, 3.0);

            // TUNE: deep blue-purple palette, never reaches true white even at "bright"
            static const uint8_t pal_deep[16][3] = {
              {0,1,4},{0,1,6},{0,2,8},{0,2,10},
              {0,3,13},{0,4,16},{1,5,20},{1,6,24},
              {2,8,29},{3,10,34},{4,13,40},{6,17,47},
              {9,22,54},{13,28,62},{18,36,70},{24,45,78}
            };
            static const uint8_t pal_mid[16][3] = {
              {1,2,8},{2,3,12},{3,5,17},{4,7,23},
              {6,10,30},{8,14,38},{11,19,47},{15,25,57},
              {20,32,68},{27,41,80},{35,52,92},{45,65,105},
              {58,80,118},{73,97,130},{92,116,142},{114,137,154}
            };
            static const uint8_t pal_bright[16][3] = {
              {3,4,15},{5,7,22},{8,11,31},{12,17,42},
              {18,25,54},{25,35,68},{34,47,83},{45,62,99},
              {58,79,115},{74,98,131},{92,118,146},{113,138,160},
              {136,158,172},{160,177,183},{186,196,193},{212,215,206}
            };

            int n = it.size();

            for (int i = 0; i < n; i++) {
              float theta = (i / (float) n) * 6.2831853f;

              float wave1 = sinf(3.0f * theta + fx_wrap(t1 * 0.6, 6.283185307179586)) * 0.5f + 0.5f;
              float wave2 = sinf(5.0f * theta - fx_wrap(t2 * 0.9, 6.283185307179586) + 1.7f) * 0.5f + 0.5f;
              float wave3 = sinf(2.0f * theta + fx_wrap(t3 * 0.4, 6.283185307179586) + 3.1f) * 0.5f + 0.5f;
              float wave4 = sinf(7.0f * theta - fx_wrap(t4 * 1.2, 6.283185307179586) + 4.4f) * 0.5f + 0.5f;

              float r = 0, g = 0, b = 0;
              int idx0, idx1; float frac, pos;

              const float REPEATS = 3.0f;
              pos = fmodf((i / (float) n) * REPEATS * 16.0f + fx_wrap(t1 * 0.8, 16.0), 16.0f);
              if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              r += pal_deep[idx0][0]*(1-frac) + pal_deep[idx1][0]*frac;
              g += pal_deep[idx0][1]*(1-frac) + pal_deep[idx1][1]*frac;
              b += pal_deep[idx0][2]*(1-frac) + pal_deep[idx1][2]*frac;

              pos = fmodf(wave1*16.0f + fx_wrap(t2 * 0.3, 16.0), 16.0f); if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              float w1 = (wave1 * 0.45f) * FX_SWING;
              r += (pal_mid[idx0][0]*(1-frac) + pal_mid[idx1][0]*frac) * w1;
              g += (pal_mid[idx0][1]*(1-frac) + pal_mid[idx1][1]*frac) * w1;
              b += (pal_mid[idx0][2]*(1-frac) + pal_mid[idx1][2]*frac) * w1;

              pos = fmodf(wave2*16.0f + fx_wrap(t3 * 0.4, 16.0), 16.0f); if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              float w2 = (wave2 * 0.35f) * FX_SWING;
              r += (pal_mid[idx0][0]*(1-frac) + pal_mid[idx1][0]*frac) * w2;
              g += (pal_mid[idx0][1]*(1-frac) + pal_mid[idx1][1]*frac) * w2;
              b += (pal_mid[idx0][2]*(1-frac) + pal_mid[idx1][2]*frac) * w2;

              // TUNE: much higher power exponents than the original - crests are
              // rare and subdued, matching a deep-water mood rather than a lit surface
              pos = fmodf(wave3*16.0f + fx_wrap(t4 * 0.5, 16.0), 16.0f); if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              float w3 = (powf(wave3, 4.5f) * 0.40f) * FX_SWING;
              r += (pal_bright[idx0][0]*(1-frac) + pal_bright[idx1][0]*frac) * w3;
              g += (pal_bright[idx0][1]*(1-frac) + pal_bright[idx1][1]*frac) * w3;
              b += (pal_bright[idx0][2]*(1-frac) + pal_bright[idx1][2]*frac) * w3;

              float w4 = (powf(wave4, 5.0f) * 0.25f) * FX_SWING;
              r += pal_bright[15][0] * w4;
              g += pal_bright[15][1] * w4;
              b += pal_bright[15][2] * w4;

              if (r > 255) r = 255;
              if (g > 255) g = 255;
              if (b > 255) b = 255;
              it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
            }

            // TUNE: rare, dim whitecaps - deep water doesn't get bright foam
            // Whitecaps: drawn from the shared dice for this 200 ms window, so
            // every ring of the same size foams on the same LEDs.
            static uint32_t last_whitecap = 0xFFFFFFFFu;
            const uint32_t wc_b = sync_bucket(T, 0.2);
            if (wc_b != last_whitecap) {
              last_whitecap = wc_b;
              uint32_t wc_k = 0;
              int num_caps = 1;
              for (int c = 0; c < num_caps; c++) {
                int idx = sync_hash(wc_b, wc_k++) % n;
                Color existing = it[idx].get();
                uint16_t brightness = existing.r + existing.g + existing.b;
                if (brightness > 140) {
                  uint8_t foam = (uint8_t) fminf(255.0f, (15 + (sync_hash(wc_b, wc_k++) % 30)) * fx_accents());
                  uint16_t nr = existing.r + foam; if (nr > 255) nr = 255;
                  uint16_t ng = existing.g + foam; if (ng > 255) ng = 255;
                  uint16_t nb = existing.b + foam; if (nb > 255) nb = 255;
                  it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
                }
              }
            }

      # ------------------------------------------------------------------
      # 4. Aurora (Solar Storm)
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Aurora (Solar Storm)"
          update_interval: 20ms
          lambda: |-
            static const uint8_t pal_aurora[16][3] = {
              {0,40,10},{0,70,20},{10,100,30},{20,140,40},
              {40,180,60},{60,210,90},{50,200,130},{40,180,170},
              {30,150,200},{40,120,210},{70,90,210},{110,70,200},
              {150,60,190},{190,60,170},{210,70,140},{180,90,120}
            };

            const int NUM_BANDS = 6;   // TUNE more bands than the original (4) - busier, more chaotic
            const bool SPARKLE_ENABLE = true;
            const int SPARKLE_CHANCE_PER_1000 = 12;   // TUNE 3x the original sparkle rate

            float t = fx_t();   // shared clock (was this light's own uptime)
            int n = it.size();
            float nf = (float) n;

            for (int i = 0; i < n; i++) {
              it[i] = Color((uint8_t)(pal_aurora[0][0]/20), (uint8_t)(pal_aurora[0][1]/20), (uint8_t)(pal_aurora[0][2]/20));
            }

            for (int b = 0; b < NUM_BANDS; b++) {
              // TUNE: roughly double the drift speed of the original
              float drift_speed = (4.0f + b) * (b % 2 == 0 ? 1.0f : -1.0f);
              float band_pos = fmodf(t * drift_speed + b * (nf / NUM_BANDS), nf);
              if (band_pos < 0) band_pos += nf;

              // TUNE: narrower bands than the original (0.14-0.20) - more distinct, more energetic
              float width = nf * (0.10f + 0.02f * (b % 3));
              float breathe_speed = 0.35f + 0.12f * b;   // TUNE faster breathing
              float breathe_phase = b * 1.7f;
              float breathing = sinf(t * breathe_speed + breathe_phase) * 0.5f + 0.5f;
              breathing = powf(breathing, 1.1f);   // TUNE less selective than the original (1.5) - stays brighter more often
              breathing = clamp01(0.5f + (breathing - 0.5f) * fx_swing());   // intensity: band contrast
              float hue_speed = 0.5f + 0.15f * b;   // TUNE faster color cycling
              float hue_phase = b * 3.3f;
              float hue_pos = fmodf(t * hue_speed + hue_phase, 16.0f);
              if (hue_pos < 0) hue_pos += 16.0f;

              int idx0 = (int) hue_pos; int idx1 = (idx0 + 1) % 16; float frac = hue_pos - idx0;
              float br = pal_aurora[idx0][0]*(1-frac) + pal_aurora[idx1][0]*frac;
              float bg = pal_aurora[idx0][1]*(1-frac) + pal_aurora[idx1][1]*frac;
              float bb = pal_aurora[idx0][2]*(1-frac) + pal_aurora[idx1][2]*frac;

              for (int i = 0; i < n; i++) {
                float dist = fabsf((float) i - band_pos);
                if (dist > nf / 2.0f) dist = nf - dist;
                float falloff = expf(-(dist * dist) / (2.0f * width * width));
                float intensity = falloff * breathing;
                if (intensity < 0.003f) continue;

                Color existing = it[i].get();
                float r = existing.r + br * intensity; if (r > 255) r = 255;
                float g = existing.g + bg * intensity; if (g > 255) g = 255;
                float bl = existing.b + bb * intensity; if (bl > 255) bl = 255;
                it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) bl);
              }
            }

            if (SPARKLE_ENABLE) {

              // Sparkles from the shared dice for this frame window, so every

              // ring of the same size sparkles on the same LEDs.

              const uint32_t sp_b = sync_bucket(fx_seconds(), 0.02);

              uint32_t sp_k = 0;
              int num_checks = n / 20 + 1;
              for (int c = 0; c < num_checks; c++) {
                if ((int)(sync_hash(sp_b, sp_k++) % 1000) < SPARKLE_CHANCE_PER_1000 * fx_accents()) {
                  int idx = (int)(sync_hash(sp_b, sp_k++) % n);
                  Color existing = it[idx].get();
                  uint8_t add = 60 + (uint8_t)(sync_hash(sp_b, sp_k++) % 80);   // TUNE brighter sparkle than the original
                  uint16_t nr = existing.r + add; if (nr > 255) nr = 255;
                  uint16_t ng = existing.g + add; if (ng > 255) ng = 255;
                  uint16_t nb = existing.b + add; if (nb > 255) nb = 255;
                  it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
                }
              }
            }

