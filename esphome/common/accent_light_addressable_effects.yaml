# ---------------------------------------------------------------------------
# All 37 addressable-LED effects for the 48-LED circular ring, as a
# complete light: block (platform + id + full effects list) rather than a
# bare effects-only file - for use with ESPHome's !extend, or just as a
# standalone full config to copy from directly.
#
# ---------------------------------------------------------------------------

# The shared phase clock. Without this these effects run off millis(),
# which counts from each light's own boot, so six addressable lights
# would beat at the same rate but at six unrelated phases. See
# light_effects_helpers.h for why gettimeofday() rather than a stamp.
esphome:
  includes:
  # Headers are named without a directory: ESPHome looks for them in your config
  # directory first, then next to this file - which is what makes the library
  # work both as a local copy and as a remote (git) package.
    - light_effects_helpers.h

light:
  - platform: esp32_rmt_led_strip   # swap for your actual platform (neopixelbus, etc.)
    id: accent_light
    name: "Accent Light"
    effects:
      - addressable_lambda:
          name: "Pacifica"
          update_interval: 20ms
          lambda: |-

            // Closed form on the shared clock: each layer's phase is the integral
            // of its wobbling speed (fx_wobble), so every light computes the same
            // sea at the same moment. It used to integrate frame by frame from
            // each light's own boot. Phases stay double until folded by fx_wrap.
            const double T = fx_seconds();
            // Intensity: swell height (fx_swing) and whitecaps (fx_accents).
            const float FX_SWING = fx_swing();
            const double t1 = fx_wobble(T, 6.0, 4.0, 0.1111111111111111, 0.0);
            const double t2 = fx_wobble(T, 4.0, 3.0, 0.07692307692307693, 1.0);
            const double t3 = fx_wobble(T, 3.0, 2.0, 0.058823529411764705, 2.0);
            const double t4 = fx_wobble(T, 2.0, 1.5, 0.047619047619047616, 3.0);

            static const uint8_t pal_deep[16][3] = {
              {0,2,3},{0,2,4},{0,2,5},{0,3,7},
              {0,3,9},{0,4,11},{0,5,14},{0,6,17},
              {0,7,21},{0,9,26},{0,12,32},{0,16,40},
              {2,24,48},{5,40,58},{10,64,70},{18,96,88}
            };
            static const uint8_t pal_mid[16][3] = {
              {0,3,5},{0,5,9},{0,8,14},{0,12,20},
              {0,17,27},{0,23,35},{0,30,44},{0,38,54},
              {0,48,64},{2,60,74},{6,74,84},{12,90,94},
              {22,108,104},{38,128,116},{60,150,130},{90,175,148}
            };
            static const uint8_t pal_bright[16][3] = {
              {0,5,10},{0,10,18},{0,18,28},{0,28,40},
              {0,40,54},{4,54,70},{10,70,88},{20,88,106},
              {34,106,124},{52,126,142},{74,146,160},{100,166,178},
              {130,188,196},{160,210,212},{195,232,228},{225,250,244}
            };

            int n = it.size();

            for (int i = 0; i < n; i++) {
              float theta = (i / (float) n) * 6.2831853f;

              float wave1 = sinf(3.0f * theta + fx_wrap(t1 * 0.6, 6.283185307179586)) * 0.5f + 0.5f;
              float wave2 = sinf(5.0f * theta - fx_wrap(t2 * 0.9, 6.283185307179586) + 1.7f) * 0.5f + 0.5f;
              float wave3 = sinf(2.0f * theta + fx_wrap(t3 * 0.4, 6.283185307179586) + 3.1f) * 0.5f + 0.5f;
              float wave4 = sinf(7.0f * theta - fx_wrap(t4 * 1.2, 6.283185307179586) + 4.4f) * 0.5f + 0.5f;

              float r = 0, g = 0, b = 0;
              int idx0, idx1; float frac, pos;

              const float REPEATS = 3.0f;
              pos = fmodf((i / (float) n) * REPEATS * 16.0f + fx_wrap(t1 * 0.8, 16.0), 16.0f);
              if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              r += pal_deep[idx0][0]*(1-frac) + pal_deep[idx1][0]*frac;
              g += pal_deep[idx0][1]*(1-frac) + pal_deep[idx1][1]*frac;
              b += pal_deep[idx0][2]*(1-frac) + pal_deep[idx1][2]*frac;

              pos = fmodf(wave1*16.0f + fx_wrap(t2 * 0.3, 16.0), 16.0f); if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              float w1 = (wave1 * 0.55f) * FX_SWING;
              r += (pal_mid[idx0][0]*(1-frac) + pal_mid[idx1][0]*frac) * w1;
              g += (pal_mid[idx0][1]*(1-frac) + pal_mid[idx1][1]*frac) * w1;
              b += (pal_mid[idx0][2]*(1-frac) + pal_mid[idx1][2]*frac) * w1;

              pos = fmodf(wave2*16.0f + fx_wrap(t3 * 0.4, 16.0), 16.0f); if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              float w2 = (wave2 * 0.45f) * FX_SWING;
              r += (pal_mid[idx0][0]*(1-frac) + pal_mid[idx1][0]*frac) * w2;
              g += (pal_mid[idx0][1]*(1-frac) + pal_mid[idx1][1]*frac) * w2;
              b += (pal_mid[idx0][2]*(1-frac) + pal_mid[idx1][2]*frac) * w2;

              pos = fmodf(wave3*16.0f + fx_wrap(t4 * 0.5, 16.0), 16.0f); if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              float w3 = (powf(wave3, 3.0f) * 0.7f) * FX_SWING;
              r += (pal_bright[idx0][0]*(1-frac) + pal_bright[idx1][0]*frac) * w3;
              g += (pal_bright[idx0][1]*(1-frac) + pal_bright[idx1][1]*frac) * w3;
              b += (pal_bright[idx0][2]*(1-frac) + pal_bright[idx1][2]*frac) * w3;

              float w4 = (powf(wave4, 4.0f) * 0.5f) * FX_SWING;
              r += pal_bright[15][0] * w4;
              g += pal_bright[15][1] * w4;
              b += pal_bright[15][2] * w4;

              if (r > 255) r = 255;
              if (g > 255) g = 255;
              if (b > 255) b = 255;
              it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
            }

            // Whitecaps: drawn from the shared dice for this 60 ms window, so
            // every ring of the same size foams on the same LEDs.
            static uint32_t last_whitecap = 0xFFFFFFFFu;
            const uint32_t wc_b = sync_bucket(T, 0.06);
            if (wc_b != last_whitecap) {
              last_whitecap = wc_b;
              uint32_t wc_k = 0;
              int num_caps = n / 40 + 1;
              for (int c = 0; c < num_caps; c++) {
                int idx = sync_hash(wc_b, wc_k++) % n;
                Color existing = it[idx].get();
                uint16_t brightness = existing.r + existing.g + existing.b;
                if (brightness > 90) {
                  uint8_t foam = (uint8_t) fminf(255.0f, (40 + (sync_hash(wc_b, wc_k++) % 80)) * fx_accents());
                  uint16_t nr = existing.r + foam; if (nr > 255) nr = 255;
                  uint16_t ng = existing.g + foam; if (ng > 255) ng = 255;
                  uint16_t nb = existing.b + foam; if (nb > 255) nb = 255;
                  it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
                }
              }
            }

      # ------------------------------------------------------------------
      # 2. TwinkleFox
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "TwinkleFox"
          update_interval: 20ms
          lambda: |-
            static const uint8_t pal[16][3] = {
              {0,0,20},{0,4,40},{0,10,60},{0,20,90},
              {10,40,120},{20,60,150},{40,90,180},{70,120,200},
              {100,150,220},{140,180,235},{180,205,245},{210,225,250},
              {230,240,255},{245,250,255},{255,255,255},{255,255,255}
            };

            const uint8_t TWINKLE_SPEED = 4;
            const uint8_t TWINKLE_DENSITY = (uint8_t) std::min(8L, std::max(1L, lroundf(5.0f * fx_swing())));   // intensity: density
            const uint8_t BACKGROUND_LEVEL = 2;
            const float INCANDESCENT_WARMTH = 0.25f;

            uint32_t ms = fx_ms();   // shared clock, so every ring twinkles alike
            uint16_t ticks = (uint16_t)(ms >> (8 - TWINKLE_SPEED));
            uint8_t fastcycle8 = (uint8_t)(ticks & 0xFF);

            int n = it.size();
            for (int i = 0; i < n; i++) {
              uint32_t h = (uint32_t) i * 2654435761u;
              uint8_t salt = (uint8_t)(h >> 24);

              uint16_t slowcycle16 = (uint16_t)((ticks >> 8) + salt);
              float sin_rad = (slowcycle16 & 0xFF) / 255.0f * 2.0f * 3.14159265f;
              uint8_t sin8_val = (uint8_t)(128.0f + 127.0f * sinf(sin_rad));
              slowcycle16 = (uint16_t)(slowcycle16 + sin8_val);
              slowcycle16 = (uint16_t)((slowcycle16 * 2053) + 1384);
              uint8_t slowcycle8 = (uint8_t)((slowcycle16 & 0xFF) + (slowcycle16 >> 8));

              uint8_t bright = 0;
              if (((slowcycle8 & 0x0E) / 2) < TWINKLE_DENSITY) {
                if (fastcycle8 < 86) {
                  bright = (uint8_t)(fastcycle8 * 3);
                } else {
                  uint8_t j = fastcycle8 - 86;
                  bright = (uint8_t)(255 - (j + (j / 2)));
                }
              }

              if (bright == 0) {
                uint8_t bg = BACKGROUND_LEVEL;
                it[i] = Color((uint8_t)(pal[0][0]*bg/255), (uint8_t)(pal[0][1]*bg/255), (uint8_t)(pal[0][2]*bg/255));
                continue;
              }

              uint8_t hue = (uint8_t)(slowcycle8 - salt);
              float pos = (hue / 255.0f) * 15.0f;
              int idx0 = (int) pos; int idx1 = (idx0 + 1) % 16; float frac = pos - idx0;

              float r = pal[idx0][0]*(1-frac) + pal[idx1][0]*frac;
              float g = pal[idx0][1]*(1-frac) + pal[idx1][1]*frac;
              float b = pal[idx0][2]*(1-frac) + pal[idx1][2]*frac;

              float scale = bright / 255.0f;
              r *= scale; g *= scale; b *= scale;

              if (INCANDESCENT_WARMTH > 0.0f && fastcycle8 < 86) {
                float cooling = ((86 - fastcycle8) / 86.0f) * INCANDESCENT_WARMTH;
                b *= (1.0f - cooling);
              }

              if (r > 255) r = 255; if (g > 255) g = 255; if (b > 255) b = 255;
              it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
            }

      # ------------------------------------------------------------------
      # 3. Fairytwinkle
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Fairytwinkle"
          update_interval: 20ms
          lambda: |-
            // Lockstep: see light_effects_helpers.h. The simulation below is the
            // original, run in fixed 20 ms ticks counted from the shared clock with
            // hashed draws, so every ring of the same size plays the identical show.
            static Lockstep ls;
            const uint32_t LS_TICK_MS = 20;
            const uint32_t ls_target = ls_begin(ls, initial_run, LS_TICK_MS, 60000 / LS_TICK_MS);
            for (uint32_t ls_t0 = micros(); ls.tick <= ls_target && ls_in_budget(ls_t0); ls.tick++) {
              const bool ls_reset = (ls.tick == 0);
              const uint32_t ls_now = ls.tick * LS_TICK_MS;
              ls.calls = 0;
              const int MAX_STARS = 24;
              static int      star_pos[MAX_STARS];
              static uint32_t star_start[MAX_STARS];
              static uint16_t star_duration[MAX_STARS];
              static uint8_t  star_hue[MAX_STARS];
              static bool     star_active[MAX_STARS];

              if (ls_reset) {
                for (int s = 0; s < MAX_STARS; s++) star_active[s] = false;
              }

              static const uint8_t pal_fairy[16][3] = {
                {255,214,140},{255,200,150},{255,190,170},{255,180,195},
                {250,175,215},{240,175,230},{225,180,240},{205,185,245},
                {185,195,250},{165,205,250},{150,215,250},{140,225,245},
                {150,230,235},{170,235,225},{200,240,215},{230,245,210}
              };

              const int DENSITY_DIVISOR = (int) std::max(2L, lroundf(10.0f / fx_swing()));   // intensity: more stars
              const uint16_t MIN_DURATION_MS = 2500;
              const uint16_t MAX_DURATION_MS = 6000;
              const int SPAWN_CHANCE_PERCENT = 6;
              const uint8_t BACKGROUND_LEVEL = 1;

              uint32_t now_ms = ls_now;
              int n = it.size();

              for (int i = 0; i < n; i++) {
                it[i] = Color((uint8_t)(pal_fairy[0][0]*BACKGROUND_LEVEL/255),
                               (uint8_t)(pal_fairy[0][1]*BACKGROUND_LEVEL/255),
                               (uint8_t)(pal_fairy[0][2]*BACKGROUND_LEVEL/255));
              }

              int active_count = 0;
              for (int s = 0; s < MAX_STARS; s++) if (star_active[s]) active_count++;

              int target = n / DENSITY_DIVISOR; if (target > MAX_STARS) target = MAX_STARS; if (target < 1) target = 1;

              if (active_count < target && ((int)(ls_rand(ls) % 100) < SPAWN_CHANCE_PERCENT)) {
                for (int s = 0; s < MAX_STARS; s++) {
                  if (!star_active[s]) {
                    star_active[s] = true;
                    star_pos[s] = (int)(ls_rand(ls) % n);
                    star_start[s] = now_ms;
                    star_duration[s] = (uint16_t)(MIN_DURATION_MS + (ls_rand(ls) % (MAX_DURATION_MS - MIN_DURATION_MS)));
                    star_hue[s] = (uint8_t)(ls_rand(ls) & 0xFF);
                    break;
                  }
                }
              }

              for (int s = 0; s < MAX_STARS; s++) {
                if (!star_active[s]) continue;
                uint32_t elapsed = now_ms - star_start[s];
                if (elapsed >= star_duration[s]) { star_active[s] = false; continue; }

                float phase = elapsed / (float) star_duration[s];
                float bright = sinf(phase * 3.14159265f);
                bright = powf(bright, 1.3f);

                float pos = (star_hue[s] / 255.0f) * 15.0f;
                int idx0 = (int) pos; int idx1 = (idx0 + 1) % 16; float frac = pos - idx0;

                float r = pal_fairy[idx0][0]*(1-frac) + pal_fairy[idx1][0]*frac;
                float g = pal_fairy[idx0][1]*(1-frac) + pal_fairy[idx1][1]*frac;
                float b = pal_fairy[idx0][2]*(1-frac) + pal_fairy[idx1][2]*frac;
                r *= bright; g *= bright; b *= bright;

                Color existing = it[star_pos[s]].get();
                float nr = existing.r + r; if (nr > 255) nr = 255;
                float ng = existing.g + g; if (ng > 255) ng = 255;
                float nb = existing.b + b; if (nb > 255) nb = 255;
                it[star_pos[s]] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
              }
            }

      # ------------------------------------------------------------------
      # 4. Aurora (continuous drift + torus distance)
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Aurora"
          update_interval: 20ms
          lambda: |-
            static const uint8_t pal_aurora[16][3] = {
              {0,40,10},{0,70,20},{10,100,30},{20,140,40},
              {40,180,60},{60,210,90},{50,200,130},{40,180,170},
              {30,150,200},{40,120,210},{70,90,210},{110,70,200},
              {150,60,190},{190,60,170},{210,70,140},{180,90,120}
            };

            const int NUM_BANDS = 4;
            const bool SPARKLE_ENABLE = true;
            const int SPARKLE_CHANCE_PER_1000 = 4;

            float t = fx_t();   // shared clock (was this light's own uptime)
            int n = it.size();
            float nf = (float) n;

            for (int i = 0; i < n; i++) {
              it[i] = Color((uint8_t)(pal_aurora[0][0]/20), (uint8_t)(pal_aurora[0][1]/20), (uint8_t)(pal_aurora[0][2]/20));
            }

            for (int b = 0; b < NUM_BANDS; b++) {
              float drift_speed = (2.0f + b) * (b % 2 == 0 ? 1.0f : -1.0f);
              float band_pos = fmodf(t * drift_speed + b * (nf / NUM_BANDS), nf);
              if (band_pos < 0) band_pos += nf;

              float width = nf * (0.14f + 0.03f * (b % 3));
              float breathe_speed = 0.15f + 0.05f * b;
              float breathe_phase = b * 1.7f;
              float breathing = sinf(t * breathe_speed + breathe_phase) * 0.5f + 0.5f;
              breathing = powf(breathing, 1.5f);
              breathing = clamp01(0.5f + (breathing - 0.5f) * fx_swing());   // intensity: band contrast
              float hue_speed = 0.25f + 0.08f * b;
              float hue_phase = b * 3.3f;
              float hue_pos = fmodf(t * hue_speed + hue_phase, 16.0f);
              if (hue_pos < 0) hue_pos += 16.0f;

              int idx0 = (int) hue_pos; int idx1 = (idx0 + 1) % 16; float frac = hue_pos - idx0;
              float br = pal_aurora[idx0][0]*(1-frac) + pal_aurora[idx1][0]*frac;
              float bg = pal_aurora[idx0][1]*(1-frac) + pal_aurora[idx1][1]*frac;
              float bb = pal_aurora[idx0][2]*(1-frac) + pal_aurora[idx1][2]*frac;

              for (int i = 0; i < n; i++) {
                float dist = fabsf((float) i - band_pos);
                if (dist > nf / 2.0f) dist = nf - dist;
                float falloff = expf(-(dist * dist) / (2.0f * width * width));
                float intensity = falloff * breathing;
                if (intensity < 0.003f) continue;

                Color existing = it[i].get();
                float r = existing.r + br * intensity; if (r > 255) r = 255;
                float g = existing.g + bg * intensity; if (g > 255) g = 255;
                float bl = existing.b + bb * intensity; if (bl > 255) bl = 255;
                it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) bl);
              }
            }

            if (SPARKLE_ENABLE) {

              // Sparkles from the shared dice for this frame window, so every

              // ring of the same size sparkles on the same LEDs.

              const uint32_t sp_b = sync_bucket(fx_seconds(), 0.02);

              uint32_t sp_k = 0;
              int num_checks = n / 20 + 1;
              for (int c = 0; c < num_checks; c++) {
                if ((int)(sync_hash(sp_b, sp_k++) % 1000) < SPARKLE_CHANCE_PER_1000 * fx_accents()) {
                  int idx = (int)(sync_hash(sp_b, sp_k++) % n);
                  Color existing = it[idx].get();
                  uint8_t add = 40 + (uint8_t)(sync_hash(sp_b, sp_k++) % 60);
                  uint16_t nr = existing.r + add; if (nr > 255) nr = 255;
                  uint16_t ng = existing.g + add; if (ng > 255) ng = 255;
                  uint16_t nb = existing.b + add; if (nb > 255) nb = 255;
                  it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
                }
              }
            }

      # ------------------------------------------------------------------
      # 5. Rolling Fog (integer-harmonic angle noise)
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Rolling Fog"
          update_interval: 30ms
          lambda: |-
            static const uint8_t pal_fog[16][3] = {
              {10,12,14},{20,22,25},{35,37,40},{50,53,58},
              {65,68,74},{80,84,92},{95,100,108},{110,115,124},
              {125,130,140},{140,146,156},{158,164,174},{176,182,192},
              {195,200,208},{212,216,222},{228,231,236},{245,247,250}
            };

            auto ring_noise = [](float theta_mult, float t_offset) -> float {
              return sinf(3.0f  * theta_mult + t_offset * 1.00f) * 0.500f
                   + sinf(7.0f  * theta_mult + t_offset * 1.31f + 1.7f) * 0.250f
                   + sinf(13.0f * theta_mult + t_offset * 1.77f + 3.1f) * 0.125f
                   + sinf(23.0f * theta_mult + t_offset * 2.35f + 0.6f) * 0.0625f;
            };

            float t = fx_t();
            int n = it.size();

            float thickness = 0.65f + 0.35f * (sinf(t * 0.02f) * 0.5f + 0.5f);

            for (int i = 0; i < n; i++) {
              float theta = (i / (float) n) * 6.2831853f;

              float layer1 = ring_noise(theta * 2.0f, t * 0.9f);
              float layer2 = ring_noise(theta * 3.0f, -t * 0.6f + 5.2f);
              float layer3 = ring_noise(theta * 5.0f, t * 1.3f + 2.7f);
              float combined = layer1 * 0.50f + layer2 * 0.35f + layer3 * 0.15f;

              float v = combined * 0.5f * fx_swing() + 0.5f;   // intensity: fog contrast
              v *= thickness;
              if (v < 0.0f) v = 0.0f;
              if (v > 1.0f) v = 1.0f;

              float pos = v * 15.0f;
              int idx0 = (int) pos; int idx1 = (idx0 + 1) % 16; float frac = pos - idx0;

              float r = pal_fog[idx0][0]*(1-frac) + pal_fog[idx1][0]*frac;
              float g = pal_fog[idx0][1]*(1-frac) + pal_fog[idx1][1]*frac;
              float b = pal_fog[idx0][2]*(1-frac) + pal_fog[idx1][2]*frac;
              it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
            }

      # ==================================================================
      # MOTION-BASED
      # ==================================================================

      # ------------------------------------------------------------------
      # 6. Meteor (continuous wraparound rotation)
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Meteor"
          update_interval: 20ms
          lambda: |-
            static float pos = 0.0f;
            static uint32_t last_ms = 0;

            if (initial_run) {
              pos = 0.0f;
              last_ms = 0;
              for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            }

            // Position comes straight from the shared clock rather than being
            // integrated frame by frame, so it no longer depends on when the
            // effect started and every ring shows the head at the same angle.
            // Speed is expressed per REVOLUTION (SPEED was tuned as LEDs/s on a
            // 48-LED ring), so a 13-LED and a 48-LED ring stay in step too.

            const float SPEED = 30.0f;
            const float DECAY = 1.0f - 0.25f / fx_swing();   // intensity: tail length
            const int HEAD_WIDTH = 2;
            const uint8_t METEOR_R = 255, METEOR_G = 255, METEOR_B = 255;

            int n = it.size();

            pos = (float) fmod(fx_seconds() * (SPEED / 48.0), 1.0) * n;
            pos = fmodf(pos, (float) n);
            if (pos < 0) pos += n;

            for (int i = 0; i < n; i++) {
              Color c = it[i].get();
              it[i] = Color((uint8_t)(c.r * DECAY), (uint8_t)(c.g * DECAY), (uint8_t)(c.b * DECAY));
            }

            int head = (int) pos;
            for (int w = -HEAD_WIDTH / 2; w <= HEAD_WIDTH / 2; w++) {
