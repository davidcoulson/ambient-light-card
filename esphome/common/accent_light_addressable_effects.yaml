              const float POP_DECAY_RATE = 3.0f;   // TUNE how fast the pop flash fades

              int n = it.size();

              for (int i = 0; i < n; i++) {
                Color c = it[i].get();
                it[i] = Color((uint8_t)(c.r * DECAY), (uint8_t)(c.g * DECAY), (uint8_t)(c.b * DECAY));
              }

              for (int b = 0; b < NUM_BUBBLES; b++) {
                if (pop_flash[b] > 0.0f) {
                  pop_flash[b] -= dt * POP_DECAY_RATE;
                  if (pop_flash[b] < 0.0f) pop_flash[b] = 0.0f;
                } else {
                  float accel = ((int) (ls_rand(ls) % 200) - 100) / 100.0f * ACCEL_STRENGTH;
                  vel[b] += accel * dt;
                  vel[b] *= (1.0f - FRICTION * dt);
                  if (vel[b] > MAX_SPEED) vel[b] = MAX_SPEED;
                  if (vel[b] < -MAX_SPEED) vel[b] = -MAX_SPEED;

                  pos[b] += vel[b] * dt;
                  pos[b] = fmodf(pos[b], (float) n); if (pos[b] < 0) pos[b] += n;

                  hue[b] = fmodf(hue[b] + hue_speed[b] * dt, 1.0f);

                  life[b] -= dt;
                  if (life[b] <= 0.0f) {
                    // pop! flash, then reappear elsewhere as a fresh bubble
                    pop_flash[b] = 1.0f;
                    pos[b] = (float)(ls_rand(ls) % n);
                    vel[b] = 0.0f;
                    hue[b] = 0.5f + (ls_rand(ls) % 250) / 1000.0f;
                    life[b] = 3.0f + (ls_rand(ls) % 5000) / 1000.0f;
                  }
                }

                float r, g, bcol;
                if (pop_flash[b] > 0.0f) {
                  hsv_to_rgb(hue[b], 0.15f, pop_flash[b], r, g, bcol);   // low saturation - flash reads near-white
                } else {
                  hsv_to_rgb(hue[b], 0.35f, MAX_BRIGHTNESS, r, g, bcol);
                }

                int idx = (int) pos[b];
                Color existing = it[idx].get();
                float nr = existing.r + r * 255.0f; if (nr > 255) nr = 255;
                float ng = existing.g + g * 255.0f; if (ng > 255) ng = 255;
                float nb = existing.b + bcol * 255.0f; if (nb > 255) nb = 255;
                it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
              }
            }

      # ------------------------------------------------------------------
      # 4. Heartbeat Pulse
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Heartbeat Pulse"
          update_interval: 20ms
          lambda: |-
            const float BPM = 60.0f;   // TUNE beats per minute
            const float PERIOD = 60.0f / BPM;

            // Intensity: calmer = a shallower beat; beyond normal the beats get sharper,
            // the "dub" harder and the gap between them darker.
            const float X = fx_extra();
            const float LUB_CENTER = 0.08f, LUB_WIDTH = 0.05f * (1.0f - 0.35f * X), LUB_STRENGTH = 1.0f;   // TUNE first beat
            const float DUB_CENTER = 0.22f, DUB_WIDTH = 0.04f * (1.0f - 0.35f * X), DUB_STRENGTH = 0.6f + 0.3f * X;   // TUNE second, softer beat
            const float MIN_LEVEL = 0.03f * (1.0f - X);   // TUNE faint resting glow between beats

            const uint8_t HEART_R = 200, HEART_G = 10, HEART_B = 30;   // TUNE pulse color

            float t = fx_t();
            float phase = fmodf(t, PERIOD) / PERIOD;   // 0..1 within one heartbeat cycle
            if (phase < 0) phase += 1.0f;

            float dl = phase - LUB_CENTER;
            float lub = expf(-(dl * dl) / (2.0f * LUB_WIDTH * LUB_WIDTH)) * LUB_STRENGTH;
            float dd = phase - DUB_CENTER;
            float dub = expf(-(dd * dd) / (2.0f * DUB_WIDTH * DUB_WIDTH)) * DUB_STRENGTH;

            float intensity = lub + dub;
            if (intensity > 1.0f) intensity = 1.0f;

            float level = MIN_LEVEL + (1.0f - MIN_LEVEL) * intensity * fx_calm(0.3f);

            int n = it.size();
            Color c = Color((uint8_t)(HEART_R * level), (uint8_t)(HEART_G * level), (uint8_t)(HEART_B * level));
            for (int i = 0; i < n; i++) it[i] = c;

      - addressable_lambda:
          name: "Soft Glow"
          update_interval: 30ms
          lambda: |-
            float ur, ug, ub;
            id(accent_light).current_values.as_rgb(&ur, &ug, &ub);

            const float BREATHE_PERIOD = 8.0f;   // TUNE seconds per full breathe cycle
            const float MIN_LEVEL = 0.55f;       // TUNE how deep the glow dims at its lowest point
            const float EASE_CURVE = 1.5f;       // TUNE higher = softer, more lingering ease in/out
            const float RIPPLE_AMOUNT = 0.15f;   // TUNE phase variation around the ring - 0 for a flat synced pulse

            float t = fx_t();
            int n = it.size();

            for (int i = 0; i < n; i++) {
              float theta = (i / (float) n) * 6.2831853f;   // integer harmonic (k=1) -> seamless wrap
              float phase_offset = RIPPLE_AMOUNT * sinf(theta);

              float breathe = sinf((t / BREATHE_PERIOD) * 6.2831853f + phase_offset) * 0.5f + 0.5f;
              breathe = powf(breathe, EASE_CURVE);
              float level = MIN_LEVEL + (1.0f - MIN_LEVEL) * breathe * fx_swing();   // intensity: breathing depth
              if (level > 1.0f) level = 1.0f;

              it[i] = Color((uint8_t)(ur * 255.0f * level), (uint8_t)(ug * 255.0f * level), (uint8_t)(ub * 255.0f * level));
            }

      - addressable_lambda:
          name: "Rolling Fog (Pronounced)"
          update_interval: 30ms
          lambda: |-
            static const uint8_t pal_fog[16][3] = {
              {10,12,14},{20,22,25},{35,37,40},{50,53,58},
              {65,68,74},{80,84,92},{95,100,108},{110,115,124},
              {125,130,140},{140,146,156},{158,164,174},{176,182,192},
              {195,200,208},{212,216,222},{228,231,236},{245,247,250}
            };

            auto ring_noise = [](float theta_mult, float t_offset) -> float {
              return sinf(3.0f  * theta_mult + t_offset * 1.00f) * 0.500f
                   + sinf(7.0f  * theta_mult + t_offset * 1.31f + 1.7f) * 0.250f
                   + sinf(13.0f * theta_mult + t_offset * 1.77f + 3.1f) * 0.125f
                   + sinf(23.0f * theta_mult + t_offset * 2.35f + 0.6f) * 0.0625f;
            };

            float t = fx_t();
            int n = it.size();

            // wider swing than the original (was 0.65-1.0) - fog visibly clears
            // before thickening back up, instead of always staying mostly opaque
            float thickness = 0.35f + 0.65f * (sinf(t * 0.03f) * 0.5f + 0.5f);

            const float CONTRAST = 1.6f * fx_swing();   // TUNE >1 pushes values toward dark/bright ends - higher = more defined banks

            for (int i = 0; i < n; i++) {
              float theta = (i / (float) n) * 6.2831853f;

              // faster drift than the original (was 0.9/0.6/1.3) - the roll
              // itself should read as motion, not a slow shimmer
              float layer1 = ring_noise(theta * 2.0f, t * 1.3f);
              float layer2 = ring_noise(theta * 3.0f, -t * 0.9f + 5.2f);
              float layer3 = ring_noise(theta * 5.0f, t * 1.8f + 2.7f);
              float combined = layer1 * 0.55f + layer2 * 0.30f + layer3 * 0.15f;   // TUNE layer weights

              float v = combined * 0.5f + 0.5f;
              v *= thickness;

              // contrast boost around the midpoint - this is what turns a smooth
              // pale-grey blur into visibly distinct thick/thin fog banks
              v = 0.5f + (v - 0.5f) * CONTRAST;
              if (v < 0.0f) v = 0.0f;
              if (v > 1.0f) v = 1.0f;

              float pos = v * 15.0f;
              int idx0 = (int) pos; int idx1 = (idx0 + 1) % 16; float frac = pos - idx0;

              float r = pal_fog[idx0][0]*(1-frac) + pal_fog[idx1][0]*frac;
              float g = pal_fog[idx0][1]*(1-frac) + pal_fog[idx1][1]*frac;
              float b = pal_fog[idx0][2]*(1-frac) + pal_fog[idx1][2]*frac;
              it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
            }

      - addressable_lambda:
          name: "Pacifica (Calm Lagoon)"
          update_interval: 20ms
          lambda: |-

            // Closed form on the shared clock: each layer's phase is the integral
            // of its wobbling speed (fx_wobble), so every light computes the same
            // sea at the same moment. It used to integrate frame by frame from
            // each light's own boot. Phases stay double until folded by fx_wrap.
            const double T = fx_seconds();
            // Intensity: swell height (fx_swing) and whitecaps (fx_accents).
            const float FX_SWING = fx_swing();
            const double t1 = fx_wobble(T, 3.5, 2.0, 0.1111111111111111, 0.0);
            const double t2 = fx_wobble(T, 2.5, 1.5, 0.07692307692307693, 1.0);
            const double t3 = fx_wobble(T, 2.0, 1.0, 0.058823529411764705, 2.0);
            const double t4 = fx_wobble(T, 1.2, 0.8, 0.047619047619047616, 3.0);

            // TUNE: brighter turquoise/teal palette - lagoon shallows, not open ocean
            static const uint8_t pal_deep[16][3] = {
              {5,40,42},{6,48,50},{8,58,60},{10,68,70},
              {12,78,80},{15,90,92},{18,102,104},{22,115,117},
              {28,128,130},{35,142,144},{45,156,158},{58,170,172},
              {75,185,187},{95,200,200},{120,215,213},{150,230,225}
            };
            static const uint8_t pal_mid[16][3] = {
              {10,60,62},{14,72,74},{18,85,87},{24,98,100},
              {30,112,114},{38,126,128},{48,140,142},{60,155,155},
              {75,170,168},{92,185,180},{112,198,190},{135,210,198},
              {160,222,205},{188,232,212},{215,242,220},{240,250,232}
            };
            static const uint8_t pal_bright[16][3] = {
              {40,140,140},{60,160,158},{85,180,175},{112,198,190},
              {140,213,202},{168,225,212},{195,235,222},{215,242,230},
              {230,247,238},{240,250,244},{247,252,248},{250,253,250},
              {252,254,252},{253,254,253},{254,255,254},{255,255,255}
            };

            int n = it.size();

            for (int i = 0; i < n; i++) {
              float theta = (i / (float) n) * 6.2831853f;

              float wave1 = sinf(3.0f * theta + fx_wrap(t1 * 0.6, 6.283185307179586)) * 0.5f + 0.5f;
              float wave2 = sinf(5.0f * theta - fx_wrap(t2 * 0.9, 6.283185307179586) + 1.7f) * 0.5f + 0.5f;
              float wave3 = sinf(2.0f * theta + fx_wrap(t3 * 0.4, 6.283185307179586) + 3.1f) * 0.5f + 0.5f;
              float wave4 = sinf(7.0f * theta - fx_wrap(t4 * 1.2, 6.283185307179586) + 4.4f) * 0.5f + 0.5f;

              float r = 0, g = 0, b = 0;
              int idx0, idx1; float frac, pos;

              const float REPEATS = 3.0f;
              pos = fmodf((i / (float) n) * REPEATS * 16.0f + fx_wrap(t1 * 0.8, 16.0), 16.0f);
              if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              r += pal_deep[idx0][0]*(1-frac) + pal_deep[idx1][0]*frac;
              g += pal_deep[idx0][1]*(1-frac) + pal_deep[idx1][1]*frac;
              b += pal_deep[idx0][2]*(1-frac) + pal_deep[idx1][2]*frac;

              pos = fmodf(wave1*16.0f + fx_wrap(t2 * 0.3, 16.0), 16.0f); if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              float w1 = (wave1 * 0.55f) * FX_SWING;
              r += (pal_mid[idx0][0]*(1-frac) + pal_mid[idx1][0]*frac) * w1;
              g += (pal_mid[idx0][1]*(1-frac) + pal_mid[idx1][1]*frac) * w1;
              b += (pal_mid[idx0][2]*(1-frac) + pal_mid[idx1][2]*frac) * w1;

              pos = fmodf(wave2*16.0f + fx_wrap(t3 * 0.4, 16.0), 16.0f); if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              float w2 = (wave2 * 0.45f) * FX_SWING;
              r += (pal_mid[idx0][0]*(1-frac) + pal_mid[idx1][0]*frac) * w2;
              g += (pal_mid[idx0][1]*(1-frac) + pal_mid[idx1][1]*frac) * w2;
              b += (pal_mid[idx0][2]*(1-frac) + pal_mid[idx1][2]*frac) * w2;

              // TUNE: softer crest weighting than the original (0.7/0.5) - gentler peaks
              pos = fmodf(wave3*16.0f + fx_wrap(t4 * 0.5, 16.0), 16.0f); if (pos < 0) pos += 16.0f;
              idx0 = (int) pos; idx1 = (idx0 + 1) % 16; frac = pos - idx0;
              float w3 = (powf(wave3, 3.0f) * 0.5f) * FX_SWING;
              r += (pal_bright[idx0][0]*(1-frac) + pal_bright[idx1][0]*frac) * w3;
              g += (pal_bright[idx0][1]*(1-frac) + pal_bright[idx1][1]*frac) * w3;
              b += (pal_bright[idx0][2]*(1-frac) + pal_bright[idx1][2]*frac) * w3;

              float w4 = (powf(wave4, 4.0f) * 0.35f) * FX_SWING;
              r += pal_bright[15][0] * w4;
              g += pal_bright[15][1] * w4;
              b += pal_bright[15][2] * w4;

              if (r > 255) r = 255;
              if (g > 255) g = 255;
              if (b > 255) b = 255;
              it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
            }

            // TUNE: less frequent, softer whitecaps than the original
            // Whitecaps: drawn from the shared dice for this 120 ms window, so
            // every ring of the same size foams on the same LEDs.
            static uint32_t last_whitecap = 0xFFFFFFFFu;
            const uint32_t wc_b = sync_bucket(T, 0.12);
            if (wc_b != last_whitecap) {
              last_whitecap = wc_b;
              uint32_t wc_k = 0;
              int num_caps = n / 60 + 1;
              for (int c = 0; c < num_caps; c++) {
                int idx = sync_hash(wc_b, wc_k++) % n;
                Color existing = it[idx].get();
                uint16_t brightness = existing.r + existing.g + existing.b;
                if (brightness > 160) {
                  uint8_t foam = (uint8_t) fminf(255.0f, (20 + (sync_hash(wc_b, wc_k++) % 40)) * fx_accents());
                  uint16_t nr = existing.r + foam; if (nr > 255) nr = 255;
                  uint16_t ng = existing.g + foam; if (ng > 255) ng = 255;
                  uint16_t nb = existing.b + foam; if (nb > 255) nb = 255;
                  it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
                }
              }
            }

