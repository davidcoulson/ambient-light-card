      # ------------------------------------------------------------------
      # 20. Firefly Jar
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Firefly Jar"
          update_interval: 30ms
          lambda: |-
            // Lockstep: see light_effects_helpers.h. The simulation below is the
            // original, run in fixed 30 ms ticks counted from the shared clock with
            // hashed draws, so every ring of the same size plays the identical show.
            static Lockstep ls;
            const uint32_t LS_TICK_MS = 30;
            const uint32_t ls_target = ls_begin(ls, initial_run, LS_TICK_MS, 60000 / LS_TICK_MS);
            for (uint32_t ls_t0 = micros(); ls.tick <= ls_target && ls_in_budget(ls_t0); ls.tick++) {
              const bool ls_reset = (ls.tick == 0);
              const uint32_t ls_now = ls.tick * LS_TICK_MS;
              ls.calls = 0;
              const float dt = LS_TICK_MS / 1000.0f;
              const int NUM_FIREFLIES = 6;

              static float    pos[NUM_FIREFLIES];
              static float    vel[NUM_FIREFLIES];
              static float    hue[NUM_FIREFLIES];
              static float    glow_phase[NUM_FIREFLIES];
              static float    glow_speed[NUM_FIREFLIES];
              static uint32_t last_ms = 0;

              if (ls_reset) {
                last_ms = 0;
                for (int f = 0; f < NUM_FIREFLIES; f++) {
                  pos[f] = (float)(ls_rand(ls) % it.size());
                  vel[f] = 0.0f;
                  hue[f] = 0.12f + (ls_rand(ls) % 100) / 1000.0f;
                  glow_phase[f] = (ls_rand(ls) % 1000) / 1000.0f * 6.2831853f;
                  glow_speed[f] = 0.3f + (ls_rand(ls) % 400) / 1000.0f;
                }
                for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
              }

              auto hsv_to_rgb = [](float h, float s, float v, float &r, float &g, float &b) {
                h = fmodf(h, 1.0f); if (h < 0) h += 1.0f;
                float i = floorf(h * 6.0f);
                float f = h * 6.0f - i;
                float p = v * (1.0f - s);
                float q = v * (1.0f - f * s);
                float w = v * (1.0f - (1.0f - f) * s);
                switch (((int) i) % 6) {
                  case 0: r = v; g = w; b = p; break;
                  case 1: r = q; g = v; b = p; break;
                  case 2: r = p; g = v; b = w; break;
                  case 3: r = p; g = q; b = v; break;
                  case 4: r = w; g = p; b = v; break;
                  default: r = v; g = p; b = q; break;
                }
              };

              uint32_t now_ms = ls_now;

              const float DECAY = 0.90f;
              const float ACCEL_STRENGTH = 8.0f;
              const float FRICTION = 1.2f;
              const float MAX_SPEED = 3.0f;
              const float MAX_BRIGHTNESS = 0.22f * fx_swing();   // intensity: glow brightness
              const float MIN_GLOW = 0.15f;

              int n = it.size();

              for (int i = 0; i < n; i++) {
                Color c = it[i].get();
                it[i] = Color((uint8_t)(c.r * DECAY), (uint8_t)(c.g * DECAY), (uint8_t)(c.b * DECAY));
              }

              for (int f = 0; f < NUM_FIREFLIES; f++) {
                float accel = ((int) (ls_rand(ls) % 200) - 100) / 100.0f * ACCEL_STRENGTH;
                vel[f] += accel * dt;
                vel[f] *= (1.0f - FRICTION * dt);
                if (vel[f] > MAX_SPEED) vel[f] = MAX_SPEED;
                if (vel[f] < -MAX_SPEED) vel[f] = -MAX_SPEED;

                pos[f] += vel[f] * dt;
                pos[f] = fmodf(pos[f], (float) n); if (pos[f] < 0) pos[f] += n;

                glow_phase[f] += glow_speed[f] * dt;
                float glow = sinf(glow_phase[f]) * 0.5f + 0.5f;
                glow = powf(glow, 1.5f);
                float brightness = (MIN_GLOW + (1.0f - MIN_GLOW) * glow) * MAX_BRIGHTNESS;

                float r, g, b;
                hsv_to_rgb(hue[f], 0.9f, brightness, r, g, b);
                int idx = (int) pos[f];
                Color existing = it[idx].get();
                float nr = existing.r + r * 255.0f; if (nr > 255) nr = 255;
                float ng = existing.g + g * 255.0f; if (ng > 255) ng = 255;
                float nb = existing.b + b * 255.0f; if (nb > 255) nb = 255;
                it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
              }
            }

