      - addressable_lambda:
          name: "Pac-Man Muncher"
          update_interval: 20ms
          lambda: |-
            // Lockstep: see light_effects_helpers.h. The simulation below is the
            // original, run in fixed 20 ms ticks counted from the shared clock with
            // hashed draws, so every ring of the same size plays the identical show.
            static Lockstep ls;
            const uint32_t LS_TICK_MS = 20;
            const uint32_t ls_target = ls_begin(ls, initial_run, LS_TICK_MS, 60000 / LS_TICK_MS);
            for (uint32_t ls_t0 = micros(); ls.tick <= ls_target && ls_in_budget(ls_t0); ls.tick++) {
              const bool ls_reset = (ls.tick == 0);
              const uint32_t ls_now = ls.tick * LS_TICK_MS;
              ls.calls = 0;
              const float dt = LS_TICK_MS / 1000.0f;
              const int MAX_LEDS = 128;   // TUNE: raise if your ring is longer

              static bool     pellet[MAX_LEDS];
              static float    pacman_pos;
              static float    ghost_pos;
              static bool     celebrating;
              static uint32_t celebrate_start;
              static uint32_t last_ms;

              if (ls_reset) {
                last_ms = 0;
                pacman_pos = 0.0f;
                celebrating = false;
                int n0 = it.size(); if (n0 > MAX_LEDS) n0 = MAX_LEDS;
                for (int i = 0; i < n0; i++) pellet[i] = true;
                ghost_pos = (float)(n0 - 6);   // starts a few pixels behind
                for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
              }

              const float PACMAN_SPEED = 8.0f;          // TUNE pixels/sec
              const float GHOST_SPEED = PACMAN_SPEED * 0.85f;   // TUNE - slower so the ghost never quite catches up
              const uint32_t CELEBRATE_MS = 1500;       // TUNE celebration flash duration
              const uint32_t FLASH_PERIOD_MS = 150;     // TUNE celebration flash rate

              uint32_t now_ms = ls_now;

              int n = it.size(); if (n > MAX_LEDS) n = MAX_LEDS;
              float nf = (float) n;

              if (!celebrating) {
                pacman_pos += PACMAN_SPEED * dt;
                pacman_pos = fmodf(pacman_pos, nf); if (pacman_pos < 0) pacman_pos += nf;
                int p_idx = (int) pacman_pos;
                if (pellet[p_idx]) pellet[p_idx] = false;

                ghost_pos += GHOST_SPEED * dt;
                ghost_pos = fmodf(ghost_pos, nf); if (ghost_pos < 0) ghost_pos += nf;

                bool any_left = false;
                for (int i = 0; i < n; i++) if (pellet[i]) { any_left = true; break; }
                if (!any_left) { celebrating = true; celebrate_start = now_ms; }
              }

              if (celebrating) {
                uint32_t elapsed = now_ms - celebrate_start;
                if (elapsed < CELEBRATE_MS) {
                  bool on = ((elapsed / FLASH_PERIOD_MS) % 2) == 0;
                  uint8_t v = on ? 255 : 0;
                  for (int i = 0; i < n; i++) it[i] = Color(v, v, 0);
                } else {
                  celebrating = false;
                  for (int i = 0; i < n; i++) pellet[i] = true;
                  pacman_pos = 0.0f;
                  ghost_pos = nf - 6.0f;
                }
              } else {
                for (int i = 0; i < n; i++) {
                  it[i] = pellet[i] ? Color(45, 45, 45) : Color(0, 0, 0);   // TUNE pellet dot brightness
                }
                it[(int) pacman_pos] = Color(255, 255, 0);    // TUNE Pac-Man color
                it[(int) ghost_pos]  = Color(0, 200, 255);     // TUNE ghost color
              }
            }

      # ------------------------------------------------------------------
      # 2. Disco Mirror Ball
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Disco Mirror Ball"
          update_interval: 20ms
          lambda: |-
            // Lockstep: see light_effects_helpers.h. The simulation below is the
            // original, run in fixed 20 ms ticks counted from the shared clock with
            // hashed draws, so every ring of the same size plays the identical show.
            static Lockstep ls;
            const uint32_t LS_TICK_MS = 20;
            const uint32_t ls_target = ls_begin(ls, initial_run, LS_TICK_MS, 60000 / LS_TICK_MS);
            // Finite memory: every pixel decays to zero within 18 ticks (x0.75 per
            // tick in uint8), the sweep is a function of the tick's own time, and the
            // sparks are hashed from the tick number. Nothing older than ~32 ticks
            // can show in the picture, so joining late skips straight to there
            // instead of replaying up to a minute - measured at 2.3 ms a tick on the
            // 48-LED ring, which was ~7 s of 280 ms main-loop stalls.
            const uint32_t LS_HORIZON = 32;
            if (ls_target > ls.tick + LS_HORIZON) {
              ls.tick = ls_target - LS_HORIZON;
              for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            }
            for (uint32_t ls_t0 = micros(); ls.tick <= ls_target && ls_in_budget(ls_t0); ls.tick++) {
              const bool ls_reset = (ls.tick == 0);
              const uint32_t ls_now = ls.tick * LS_TICK_MS;
              ls.calls = 0;
              auto hsv_to_rgb = [](float h, float s, float v, float &r, float &g, float &b) {
                h = fmodf(h, 1.0f); if (h < 0) h += 1.0f;
                float i = floorf(h * 6.0f);
                float f = h * 6.0f - i;
                float p = v * (1.0f - s);
                float q = v * (1.0f - f * s);
                float w = v * (1.0f - (1.0f - f) * s);
                switch (((int) i) % 6) {
                  case 0: r = v; g = w; b = p; break;
                  case 1: r = q; g = v; b = p; break;
                  case 2: r = p; g = v; b = w; break;
                  case 3: r = p; g = q; b = v; break;
                  case 4: r = w; g = p; b = v; break;
                  default: r = v; g = p; b = q; break;
                }
              };

              const float DECAY = 0.75f;          // TUNE fast decay - keeps sparkles crisp, not smeared
              const int SPARKS_PER_FRAME = (int) lroundf(3.0f * fx_swing());     // TUNE sparkle density
              const float ROT_SPEED = 0.08f;      // TUNE slow rotation speed of the colored sweep
              const float SWEEP_INTENSITY = 0.25f;// TUNE how strong the dim colored underlay is

              // The time OF THIS TICK, not the live clock: a replayed tick has to
              // compute what it would have computed when it was current.
              float t = sync_fold(ls_seconds(ls, LS_TICK_MS, 60000 / LS_TICK_MS));
              int n = it.size();
              float nf = (float) n;

              for (int i = 0; i < n; i++) {
                Color c = it[i].get();
                it[i] = Color((uint8_t)(c.r * DECAY), (uint8_t)(c.g * DECAY), (uint8_t)(c.b * DECAY));
              }

              float sweep_width = nf * 0.25f;     // TUNE sweep band width
              float sweep_pos = fmodf(t * ROT_SPEED, 1.0f) * nf;
              float sweep_hue = fmodf(t * 0.05f, 1.0f);
              float sr, sg, sb;
              hsv_to_rgb(sweep_hue, 0.8f, 1.0f, sr, sg, sb);

              for (int i = 0; i < n; i++) {
                float dist = fabsf((float) i - sweep_pos);
                if (dist > nf / 2.0f) dist = nf - dist;
                float falloff = expf(-(dist * dist) / (2.0f * sweep_width * sweep_width));
                float intensity = falloff * SWEEP_INTENSITY;
                if (intensity < 0.003f) continue;

                Color existing = it[i].get();
                float nr = existing.r + sr * 255.0f * intensity; if (nr > 255) nr = 255;
                float ng = existing.g + sg * 255.0f * intensity; if (ng > 255) ng = 255;
                float nb = existing.b + sb * 255.0f * intensity; if (nb > 255) nb = 255;
                it[i] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
              }

              for (int s = 0; s < SPARKS_PER_FRAME; s++) {
                int idx = (int)(ls_rand(ls) % n);
                it[idx] = Color(255, 255, 255);   // crisp white facet-glint flash
              }
            }

