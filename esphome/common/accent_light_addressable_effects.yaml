              float v_pixel = v + (salt - 0.5f) * PIXEL_JITTER;
              if (v_pixel < 0.12f) v_pixel = 0.12f;
              if (v_pixel > 1.0f) v_pixel = 1.0f;

              float pos = v_pixel * 15.0f;
