      - addressable_lambda:
          name: "Ember Ring"
          update_interval: 40ms
          lambda: |-
            static const uint8_t pal_embers[16][3] = {
              {30,4,0},{45,7,0},{60,10,0},{80,14,0},
              {100,20,0},{120,28,0},{145,38,0},{170,50,0},
              {195,64,2},{215,80,6},{230,95,12},{242,110,20},
              {250,125,30},{255,142,45},{255,160,65},{255,180,90}
            };

            auto noise1d = [](float x) -> float {
              return sinf(x * 1.0f) * 0.500f
                   + sinf(x * 2.13f + 1.7f) * 0.250f
                   + sinf(x * 4.07f + 3.1f) * 0.125f
                   + sinf(x * 8.53f + 0.6f) * 0.0625f;
            };

            const float BASE_SPEED = 0.4f;    // TUNE base glow drift speed
            const float FLARE_SPEED = 0.9f;   // TUNE flare-up frequency
            const float FLARE_STRENGTH = 0.4f;// TUNE how bright flares get

            float t = fx_t();
            int n = it.size();

            for (int i = 0; i < n; i++) {
              // per-pixel independent phase offset via hash - no spatial
              // continuity needed between neighbors, embers don't need to blend
              uint32_t h = (uint32_t) i * 2654435761u;
              float salt = ((h >> 16) & 0xFFFF) / 65535.0f * 100.0f;

              float base = noise1d(t * BASE_SPEED + salt) * 0.5f + 0.5f;
              float v = 0.30f + (0.5f + (base - 0.5f) * fx_swing()) * 0.35f;   // intensity: glow movement

              float flare_noise = noise1d(t * FLARE_SPEED + salt * 1.7f + 50.0f) * 0.5f + 0.5f;
              float flare = powf(flare_noise, 4.0f) * FLARE_STRENGTH * fx_accents();   // occasional brighter spikes
              v += flare;

              if (v > 1.0f) v = 1.0f;
              if (v < 0.0f) v = 0.0f;

              float pos = v * 15.0f;
              int idx0 = (int) pos; int idx1 = (idx0 + 1) % 16; float frac = pos - idx0;

              float r = pal_embers[idx0][0]*(1-frac) + pal_embers[idx1][0]*frac;
              float g = pal_embers[idx0][1]*(1-frac) + pal_embers[idx1][1]*frac;
              float b = pal_embers[idx0][2]*(1-frac) + pal_embers[idx1][2]*frac;
              it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
            }

      # ------------------------------------------------------------------
      # 2. Radial Flicker
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Radial Flicker"
          update_interval: 30ms
          lambda: |-
            // Lockstep: see light_effects_helpers.h. The simulation below is the
            // original, run in fixed 30 ms ticks counted from the shared clock with
            // hashed draws, so every ring of the same size plays the identical show.
            static Lockstep ls;
            const uint32_t LS_TICK_MS = 30;
            const uint32_t ls_target = ls_begin(ls, initial_run, LS_TICK_MS, 60000 / LS_TICK_MS);
            for (uint32_t ls_t0 = micros(); ls.tick <= ls_target && ls_in_budget(ls_t0); ls.tick++) {
              const bool ls_reset = (ls.tick == 0);
              const uint32_t ls_now = ls.tick * LS_TICK_MS;
              ls.calls = 0;
              const float dt = LS_TICK_MS / 1000.0f;
              const int NUM_HOTSPOTS = 2;   // TUNE number of glowing hot spots

              static float    hotspot_pos[NUM_HOTSPOTS];
              static float    hotspot_drift[NUM_HOTSPOTS];
              static float    hotspot_phase[NUM_HOTSPOTS];
              static uint32_t last_ms = 0;

              if (ls_reset) {
                last_ms = 0;
                for (int s = 0; s < NUM_HOTSPOTS; s++) {
                  hotspot_pos[s] = (float)(ls_rand(ls) % it.size());
                  bool cw = (ls_rand(ls) % 2) == 0;
                  hotspot_drift[s] = (cw ? 1.0f : -1.0f) * (1.0f + (ls_rand(ls) % 1000) / 1000.0f);   // TUNE slow drift
                  hotspot_phase[s] = (ls_rand(ls) % 1000) / 1000.0f * 100.0f;
                }
                for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
              }

              static const uint8_t pal_embers[16][3] = {
                {30,4,0},{45,7,0},{60,10,0},{80,14,0},
                {100,20,0},{120,28,0},{145,38,0},{170,50,0},
                {195,64,2},{215,80,6},{230,95,12},{242,110,20},
                {250,125,30},{255,142,45},{255,160,65},{255,180,90}
              };

              auto noise1d = [](float x) -> float {
                return sinf(x * 1.0f) * 0.500f
                     + sinf(x * 2.13f + 1.7f) * 0.250f
                     + sinf(x * 4.07f + 3.1f) * 0.125f
                     + sinf(x * 8.53f + 0.6f) * 0.0625f;
              };

              uint32_t now_ms = ls_now;

              float t = sync_fold(ls_seconds(ls, LS_TICK_MS, 60000 / LS_TICK_MS));
              int n = it.size();
              float nf = (float) n;
              float width = nf * 0.18f;   // TUNE spread of heat around each hot spot

              const uint8_t BG_R = 8, BG_G = 1, BG_B = 0;   // TUNE dim ember-glow background
              for (int i = 0; i < n; i++) it[i] = Color(BG_R, BG_G, BG_B);

              for (int s = 0; s < NUM_HOTSPOTS; s++) {
                hotspot_pos[s] += hotspot_drift[s] * dt;
                hotspot_pos[s] = fmodf(hotspot_pos[s], nf); if (hotspot_pos[s] < 0) hotspot_pos[s] += nf;

                float flicker = noise1d(t * 1.5f + hotspot_phase[s]) * 0.5f + 0.5f;
                flicker = 1.0f - 0.5f * fx_swing() + 0.5f * fx_swing() * flicker;   // intensity: flicker depth   // TUNE flicker floor - keeps a baseline glow

                float pos = 9.0f + flicker * 6.0f;   // TUNE palette range this hot spot cycles through
                int idx0 = (int) pos; int idx1 = (idx0 + 1) % 16; float frac = pos - idx0;
                float pr = pal_embers[idx0][0]*(1-frac) + pal_embers[idx1][0]*frac;
                float pg = pal_embers[idx0][1]*(1-frac) + pal_embers[idx1][1]*frac;
                float pb = pal_embers[idx0][2]*(1-frac) + pal_embers[idx1][2]*frac;

                for (int i = 0; i < n; i++) {
                  float dist = fabsf((float) i - hotspot_pos[s]);
                  if (dist > nf / 2.0f) dist = nf - dist;   // torus distance - heat spreads both ways
                  float falloff = expf(-(dist * dist) / (2.0f * width * width));
                  float intensity = falloff * flicker;
                  if (intensity < 0.01f) continue;

                  Color existing = it[i].get();
                  float r = existing.r + pr * intensity; if (r > 255) r = 255;
                  float g = existing.g + pg * intensity; if (g > 255) g = 255;
                  float b = existing.b + pb * intensity; if (b > 255) b = 255;
                  it[i] = Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
                }
              }
            }

