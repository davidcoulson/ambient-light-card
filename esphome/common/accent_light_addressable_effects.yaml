      # ------------------------------------------------------------------
      # 7. Scanner (rotating eye + torus distance falloff)
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Scanner"
          update_interval: 20ms
          lambda: |-
            static float pos = 0.0f;
            static uint32_t last_ms = 0;

            if (initial_run) { pos = 0.0f; last_ms = 0; }

            // Position comes straight from the shared clock rather than being
            // integrated frame by frame, so it no longer depends on when the
            // effect started and every ring shows the head at the same angle.
            // Speed is expressed per REVOLUTION (SPEED was tuned as LEDs/s on a
            // 48-LED ring), so a 13-LED and a 48-LED ring stay in step too.

            const float SPEED = 40.0f;
            const float EYE_WIDTH = 4.0f * fx_swing();   // intensity: eye width
            const uint8_t EYE_R = 255, EYE_G = 0, EYE_B = 0;

            int n = it.size();
            float nf = (float) n;

            pos = (float) fmod(fx_seconds() * (SPEED / 48.0), 1.0) * n;
            pos = fmodf(pos, nf);
            if (pos < 0) pos += nf;

            for (int i = 0; i < n; i++) {
              float dist = fabsf((float) i - pos);
              if (dist > nf / 2.0f) dist = nf - dist;
              float b = 1.0f - dist / EYE_WIDTH;
              if (b < 0.0f) b = 0.0f;
              b = b * b;
              it[i] = Color((uint8_t)(EYE_R * b), (uint8_t)(EYE_G * b), (uint8_t)(EYE_B * b));
            }

      # ------------------------------------------------------------------
      # 8. Ripple (torus distance, rings meet on the far side)
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Ripple"
          update_interval: 30ms
          lambda: |-
            // Lockstep: see light_effects_helpers.h. The simulation below is the
            // original, run in fixed 30 ms ticks counted from the shared clock with
            // hashed draws, so every ring of the same size plays the identical show.
            static Lockstep ls;
            const uint32_t LS_TICK_MS = 30;
            const uint32_t ls_target = ls_begin(ls, initial_run, LS_TICK_MS, 60000 / LS_TICK_MS);
            for (uint32_t ls_t0 = micros(); ls.tick <= ls_target && ls_in_budget(ls_t0); ls.tick++) {
              const bool ls_reset = (ls.tick == 0);
              const uint32_t ls_now = ls.tick * LS_TICK_MS;
              ls.calls = 0;
              const int MAX_RIPPLES = 6;
              static int      ripple_pos[MAX_RIPPLES];
              static uint32_t ripple_start[MAX_RIPPLES];
              static uint16_t ripple_duration[MAX_RIPPLES];
              static float    ripple_hue[MAX_RIPPLES];
              static bool     ripple_active[MAX_RIPPLES];

              if (ls_reset) { for (int s = 0; s < MAX_RIPPLES; s++) ripple_active[s] = false; }

              auto hsv_to_rgb = [](float h, float s, float v, float &r, float &g, float &b) {
                h = fmodf(h, 1.0f); if (h < 0) h += 1.0f;
                float i = floorf(h * 6.0f);
                float f = h * 6.0f - i;
                float p = v * (1.0f - s);
                float q = v * (1.0f - f * s);
                float w = v * (1.0f - (1.0f - f) * s);
                switch (((int) i) % 6) {
                  case 0: r = v; g = w; b = p; break;
                  case 1: r = q; g = v; b = p; break;
                  case 2: r = p; g = v; b = w; break;
                  case 3: r = p; g = q; b = v; break;
                  case 4: r = w; g = p; b = v; break;
                  default: r = v; g = p; b = q; break;
                }
              };

              uint32_t now_ms = ls_now;
              int n = it.size();
              float nf = (float) n;

              for (int i = 0; i < n; i++) {
                Color c = it[i].get();
                it[i] = Color((uint8_t)(c.r * 0.92f), (uint8_t)(c.g * 0.92f), (uint8_t)(c.b * 0.92f));
              }

              int active_count = 0;
              for (int s = 0; s < MAX_RIPPLES; s++) if (ripple_active[s]) active_count++;
              if (active_count < MAX_RIPPLES && ((ls_rand(ls) % 1000) < 8)) {
                for (int s = 0; s < MAX_RIPPLES; s++) {
                  if (!ripple_active[s]) {
                    ripple_active[s] = true;
                    ripple_pos[s] = (int)(ls_rand(ls) % n);
                    ripple_start[s] = now_ms;
                    ripple_duration[s] = (uint16_t)(1200 + (ls_rand(ls) % 1200));
                    ripple_hue[s] = (ls_rand(ls) % 1000) / 1000.0f;
                    break;
                  }
                }
              }

              for (int s = 0; s < MAX_RIPPLES; s++) {
                if (!ripple_active[s]) continue;
                uint32_t elapsed = now_ms - ripple_start[s];
                if (elapsed >= ripple_duration[s]) { ripple_active[s] = false; continue; }

                float phase = elapsed / (float) ripple_duration[s];
                float radius = phase * (nf * 0.5f);
                float fade = 1.0f - phase;
                const float RING_WIDTH = 2.0f * fx_swing();   // intensity: ring width

                float cr, cg, cb;
                hsv_to_rgb(ripple_hue[s], 0.7f, 1.0f, cr, cg, cb);

                for (int side = -1; side <= 1; side += 2) {
                  int center = ((ripple_pos[s] + (int)(side * radius)) % n + n) % n;
                  for (int w = -3; w <= 3; w++) {
                    int idx = ((center + w) % n + n) % n;
                    float dist = fabsf((float) w);
                    float intensity = 1.0f - dist / RING_WIDTH;
                    if (intensity < 0.0f) continue;
                    intensity *= fade;

                    Color existing = it[idx].get();
                    float nr = existing.r + cr * 255.0f * intensity; if (nr > 255) nr = 255;
                    float ng = existing.g + cg * 255.0f * intensity; if (ng > 255) ng = 255;
                    float nb = existing.b + cb * 255.0f * intensity; if (nb > 255) nb = 255;
                    it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
                  }
                }
              }
            }

