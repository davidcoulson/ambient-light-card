      # ------------------------------------------------------------------
      # 12. Halloween Eyes (eye gap wraps with modulo)
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Halloween Eyes"
          update_interval: 30ms
          lambda: |-
            // Lockstep: see light_effects_helpers.h. The simulation below is the
            // original, run in fixed 30 ms ticks counted from the shared clock with
            // hashed draws, so every ring of the same size plays the identical show.
            static Lockstep ls;
            const uint32_t LS_TICK_MS = 30;
            const uint32_t ls_target = ls_begin(ls, initial_run, LS_TICK_MS, 60000 / LS_TICK_MS);
            for (uint32_t ls_t0 = micros(); ls.tick <= ls_target && ls_in_budget(ls_t0); ls.tick++) {
              const bool ls_reset = (ls.tick == 0);
              const uint32_t ls_now = ls.tick * LS_TICK_MS;
              ls.calls = 0;
              const int MAX_EYES = 2;
              const int EYE_GAP = 3;

              static int      eye_pos[MAX_EYES];
              static int      eye_state[MAX_EYES];
              static uint32_t eye_state_start[MAX_EYES];
              static uint32_t eye_next_ms[MAX_EYES];
              static uint16_t eye_hold_ms[MAX_EYES];

              if (ls_reset) {
                for (int e = 0; e < MAX_EYES; e++) {
                  eye_state[e] = 0;
                  eye_next_ms[e] = ls_now + (ls_rand(ls) % 4000);
                }
                for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
              }

              const uint8_t EYE_R = 255, EYE_G = 130, EYE_B = 0;
              const uint16_t FADE_IN_MS = 400;
              const uint16_t FADE_OUT_MS = 600;

              uint32_t now_ms = ls_now;
              int n = it.size();

              for (int i = 0; i < n; i++) it[i] = Color(0, 0, 0);

              for (int e = 0; e < MAX_EYES; e++) {
                float brightness = 0.0f;

                if (eye_state[e] == 0) {
                  if (now_ms >= eye_next_ms[e]) {
                    eye_pos[e] = (int)(ls_rand(ls) % n);
                    eye_state[e] = 1;
                    eye_state_start[e] = now_ms;
                    eye_hold_ms[e] = (uint16_t)(1500 + (ls_rand(ls) % 2500));
                  }
                } else if (eye_state[e] == 1) {
                  uint32_t elapsed = now_ms - eye_state_start[e];
                  brightness = elapsed / (float) FADE_IN_MS;
                  if (brightness >= 1.0f) { brightness = 1.0f; eye_state[e] = 2; eye_state_start[e] = now_ms; }
                } else if (eye_state[e] == 2) {
                  brightness = 1.0f;
                  if (now_ms - eye_state_start[e] >= eye_hold_ms[e]) { eye_state[e] = 3; eye_state_start[e] = now_ms; }
                } else if (eye_state[e] == 3) {
                  uint32_t elapsed = now_ms - eye_state_start[e];
                  brightness = 1.0f - elapsed / (float) FADE_OUT_MS;
                  if (brightness <= 0.0f) {
                    brightness = 0.0f;
                    eye_state[e] = 0;
                    eye_next_ms[e] = now_ms + 2000 + (ls_rand(ls) % 6000);
                  }
                }

                if (brightness > 0.0f) {
                  int p1 = eye_pos[e];
                  int p2 = (eye_pos[e] + EYE_GAP) % n;
                  it[p1] = Color((uint8_t)(EYE_R*brightness), (uint8_t)(EYE_G*brightness), (uint8_t)(EYE_B*brightness));
                  it[p2] = Color((uint8_t)(EYE_R*brightness), (uint8_t)(EYE_G*brightness), (uint8_t)(EYE_B*brightness));
                }
              }
            }

