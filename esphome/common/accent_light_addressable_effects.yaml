              const float ROT_SPEED = 1.2f;
              const float DECAY = 0.88f;
              const float MAX_BRIGHTNESS = 0.20f;

              int n = it.size();
              float t = sync_fold(ls_seconds(ls, LS_TICK_MS, 60000 / LS_TICK_MS));

              pos += ROT_SPEED * dt;
              pos = fmodf(pos, (float) n); if (pos < 0) pos += n;

              float base  = noise1d(t * 3.0f) * 0.5f + 0.5f;
              float micro = noise1d(t * 11.3f + 2.0f) * 0.5f + 0.5f;
