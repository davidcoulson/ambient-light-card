                      p_active[i] = true;
                      p_pos[i] = rocket_pos;
                      p_vel[i] = ((ls_rand(ls) % 200) - 100) * 0.6f;
                      p_life[i] = PARTICLE_LIFE;
                      p_hue[i] = rocket_hue + ((ls_rand(ls) % 200) - 100) / 1000.0f;
                      spawned++;
                    }
                  }
                }
              }

              for (int i = 0; i < MAX_PARTICLES; i++) {
                if (!p_active[i]) continue;
                p_vel[i] -= DECEL * 0.5f * dt;
                p_pos[i] += p_vel[i] * dt;
                p_pos[i] = fmodf(p_pos[i], nf); if (p_pos[i] < 0) p_pos[i] += nf;
                p_life[i] -= dt / PARTICLE_LIFE;

                if (p_life[i] <= 0.0f) { p_active[i] = false; continue; }

                float r, g, b;
                hsv_to_rgb(p_hue[i], 1.0f, p_life[i], r, g, b);
                int idx = (int) p_pos[i];
                Color existing = it[idx].get();
                float nr = existing.r + r * 255.0f; if (nr > 255) nr = 255;
                float ng = existing.g + g * 255.0f; if (ng > 255) ng = 255;
                float nb = existing.b + b * 255.0f; if (nb > 255) nb = 255;
                it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
              }
            }

      # ==================================================================
      # ROTATION-NATIVE (built for a ring, not adapted from a strip)
      # ==================================================================

      # ------------------------------------------------------------------
      # 15. Plasma
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Plasma"
          update_interval: 20ms
          lambda: |-
            auto hsv_to_rgb = [](float h, float s, float v, float &r, float &g, float &b) {
              h = fmodf(h, 1.0f); if (h < 0) h += 1.0f;
              float i = floorf(h * 6.0f);
              float f = h * 6.0f - i;
              float p = v * (1.0f - s);
              float q = v * (1.0f - f * s);
              float w = v * (1.0f - (1.0f - f) * s);
              switch (((int) i) % 6) {
                case 0: r = v; g = w; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = w; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = w; g = p; b = v; break;
                default: r = v; g = p; b = q; break;
              }
            };

            float t = fx_t();
            int n = it.size();

            for (int i = 0; i < n; i++) {
              float theta = (i / (float) n) * 6.2831853f;

              float hue_noise = sinf(3.0f * theta + t * 0.5f) * 0.5f
                              + sinf(5.0f * theta - t * 0.35f + 1.3f) * 0.3f
                              + sinf(8.0f * theta + t * 0.8f + 2.7f) * 0.2f;
              float hue = fmodf(hue_noise * 0.5f + 0.5f + t * 0.05f, 1.0f);
              if (hue < 0) hue += 1.0f;

              float bright_noise = sinf(4.0f * theta - t * 0.6f + 0.9f) * 0.5f + 0.5f;
              float breathe = powf(bright_noise, 1.3f);

              const float SAT = clamp01(0.85f * fx_swing());   // intensity: colour depth
              const float MIN_VALUE = 0.4f;

              float r, g, b;
              hsv_to_rgb(hue, SAT, MIN_VALUE + (1.0f - MIN_VALUE) * breathe, r, g, b);
              it[i] = Color((uint8_t)(r * 255), (uint8_t)(g * 255), (uint8_t)(b * 255));
            }

      # ------------------------------------------------------------------
      # 16. Comet Swarm
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Comet Swarm"
          update_interval: 20ms
          lambda: |-
            // Lockstep: see light_effects_helpers.h. The simulation below is the
            // original, run in fixed 20 ms ticks counted from the shared clock with
            // hashed draws, so every ring of the same size plays the identical show.
            static Lockstep ls;
            const uint32_t LS_TICK_MS = 20;
            const uint32_t ls_target = ls_begin(ls, initial_run, LS_TICK_MS, 60000 / LS_TICK_MS);
            for (uint32_t ls_t0 = micros(); ls.tick <= ls_target && ls_in_budget(ls_t0); ls.tick++) {
              const bool ls_reset = (ls.tick == 0);
              const uint32_t ls_now = ls.tick * LS_TICK_MS;
              ls.calls = 0;
              const float dt = LS_TICK_MS / 1000.0f;
              const int NUM_COMETS = 4;

              static float    pos[NUM_COMETS];
              static float    speed[NUM_COMETS];
              static float    hue[NUM_COMETS];
              static uint32_t last_ms = 0;

              if (ls_reset) {
                last_ms = 0;
                for (int c = 0; c < NUM_COMETS; c++) {
                  pos[c] = (float)(ls_rand(ls) % it.size());
                  bool cw = (ls_rand(ls) % 2) == 0;
                  speed[c] = (cw ? 1.0f : -1.0f) * (15.0f + (ls_rand(ls) % 40));
                  hue[c] = (float) c / NUM_COMETS;
                }
                for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
              }

              auto hsv_to_rgb = [](float h, float s, float v, float &r, float &g, float &b) {
                h = fmodf(h, 1.0f); if (h < 0) h += 1.0f;
                float i = floorf(h * 6.0f);
                float f = h * 6.0f - i;
                float p = v * (1.0f - s);
                float q = v * (1.0f - f * s);
                float w = v * (1.0f - (1.0f - f) * s);
                switch (((int) i) % 6) {
                  case 0: r = v; g = w; b = p; break;
                  case 1: r = q; g = v; b = p; break;
                  case 2: r = p; g = v; b = w; break;
                  case 3: r = p; g = q; b = v; break;
                  case 4: r = w; g = p; b = v; break;
                  default: r = v; g = p; b = q; break;
                }
              };

              uint32_t now_ms = ls_now;

              const float DECAY = 1.0f - 0.20f / fx_swing();   // intensity: tail length
              int n = it.size();
              float nf = (float) n;

              for (int i = 0; i < n; i++) {
                Color c = it[i].get();
                it[i] = Color((uint8_t)(c.r * DECAY), (uint8_t)(c.g * DECAY), (uint8_t)(c.b * DECAY));
              }

              for (int c = 0; c < NUM_COMETS; c++) {
                pos[c] += speed[c] * dt;
                pos[c] = fmodf(pos[c], nf); if (pos[c] < 0) pos[c] += nf;

                int idx = (int) pos[c];
                float r, g, b;
                hsv_to_rgb(hue[c], 1.0f, 1.0f, r, g, b);

                Color existing = it[idx].get();
                float nr = existing.r + r * 255.0f; if (nr > 255) nr = 255;
                float ng = existing.g + g * 255.0f; if (ng > 255) ng = 255;
                float nb = existing.b + b * 255.0f; if (nb > 255) nb = 255;
                it[idx] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
              }
            }

      # ------------------------------------------------------------------
      # 17. Theater Chase
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Theater Chase"
          update_interval: 20ms
          lambda: |-
            const int GROUP_SIZE = 3;   // divides evenly into 48 - keep it that way if you resize
            const uint32_t STEP_MS = 100;

            static int      offset = 0;
            static uint32_t last_step_ms = 0;

            if (initial_run) { offset = 0; last_step_ms = 0; }

            auto hsv_to_rgb = [](float h, float s, float v, float &r, float &g, float &b) {
              h = fmodf(h, 1.0f); if (h < 0) h += 1.0f;
              float i = floorf(h * 6.0f);
              float f = h * 6.0f - i;
              float p = v * (1.0f - s);
              float q = v * (1.0f - f * s);
              float w = v * (1.0f - (1.0f - f) * s);
              switch (((int) i) % 6) {
                case 0: r = v; g = w; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = w; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = w; g = p; b = v; break;
                default: r = v; g = p; b = q; break;
              }
            };

            // Step index from the shared clock: every ring is on the same step.
            offset = (int) ((fx_ms() / STEP_MS) % GROUP_SIZE);

            float t = fx_t();
            float hue = fmodf(t * 0.10f, 1.0f);

            float r, g, b;
            hsv_to_rgb(hue, 1.0f, 1.0f, r, g, b);
            uint8_t lit_r = (uint8_t)(r * 255), lit_g = (uint8_t)(g * 255), lit_b = (uint8_t)(b * 255);

            int n = it.size();
            for (int i = 0; i < n; i++) {
              bool lit = ((i + offset) % GROUP_SIZE) == 0;
              it[i] = lit ? Color(lit_r, lit_g, lit_b) : Color(0, 0, 0);
            }

      # ------------------------------------------------------------------
      # 18. Pinwheel
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Pinwheel"
          update_interval: 20ms
          lambda: |-
            const int NUM_SPOKES = 6;
            const float ROT_SPEED = 0.15f;

            auto hsv_to_rgb = [](float h, float s, float v, float &r, float &g, float &b) {
              h = fmodf(h, 1.0f); if (h < 0) h += 1.0f;
              float i = floorf(h * 6.0f);
              float f = h * 6.0f - i;
              float p = v * (1.0f - s);
              float q = v * (1.0f - f * s);
              float w = v * (1.0f - (1.0f - f) * s);
              switch (((int) i) % 6) {
                case 0: r = v; g = w; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = w; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = w; g = p; b = v; break;
                default: r = v; g = p; b = q; break;
              }
            };

            float t = fx_t();
            int n = it.size();

            for (int i = 0; i < n; i++) {
              float theta = (i / (float) n) + t * ROT_SPEED;
              theta = fmodf(theta, 1.0f); if (theta < 0) theta += 1.0f;

              int spoke = ((int)(theta * NUM_SPOKES)) % NUM_SPOKES;
              float hue = (float) spoke / NUM_SPOKES;

              float r, g, b;
              hsv_to_rgb(hue, 1.0f, 1.0f, r, g, b);
              it[i] = Color((uint8_t)(r * 255), (uint8_t)(g * 255), (uint8_t)(b * 255));
            }

      # ------------------------------------------------------------------
      # 19. Lighthouse
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Lighthouse"
          update_interval: 20ms
          lambda: |-
            static float    pos = 0.0f;
            static uint32_t last_ms = 0;

            const uint8_t AMB_R = 2, AMB_G = 2, AMB_B = 6;

            if (initial_run) {
              pos = 0.0f;
              last_ms = 0;
              for (int i = 0; i < it.size(); i++) it[i] = Color(AMB_R, AMB_G, AMB_B);
            }

            // Position comes straight from the shared clock rather than being
            // integrated frame by frame, so it no longer depends on when the
            // effect started and every ring shows the head at the same angle.
            // Speed is expressed per REVOLUTION (SPEED was tuned as LEDs/s on a
            // 48-LED ring), so a 13-LED and a 48-LED ring stay in step too.

            const float SPEED = 25.0f;
            const float DECAY = 1.0f - 0.15f / fx_swing();   // intensity: beam trail
            const uint8_t BEAM_R = 255, BEAM_G = 220, BEAM_B = 140;

            int n = it.size();
            float nf = (float) n;

            pos = (float) fmod(fx_seconds() * (SPEED / 48.0), 1.0) * n;
            pos = fmodf(pos, nf); if (pos < 0) pos += nf;

            for (int i = 0; i < n; i++) {
              Color c = it[i].get();
              float nr = AMB_R + (c.r - AMB_R) * DECAY; if (nr < 0) nr = 0;
              float ng = AMB_G + (c.g - AMB_G) * DECAY; if (ng < 0) ng = 0;
              float nb = AMB_B + (c.b - AMB_B) * DECAY; if (nb < 0) nb = 0;
              it[i] = Color((uint8_t) nr, (uint8_t) ng, (uint8_t) nb);
            }

            int head = (int) pos;
            it[head] = Color(BEAM_R, BEAM_G, BEAM_B);

