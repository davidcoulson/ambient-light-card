            }();
            HwColor c = hz_render([](const HwT &t) { return hz_vortex(t, me); });
            out_rgb(id(accent_light), id(red_output), id(green_output), id(blue_output), c.r, c.g, c.b);
      # Every light its own candle, each on its own flicker.
      - lambda:
          name: "Halloween - 2D Candlelight"
          update_interval: 40ms
          lambda: |-
            static const HzSelf me = [] {
              float x, y;
              light_xy("${mac}", x, y);
              return hz_at(x, y, ROOM_ASPECT, room_self("${mac}"), "${mac}");
            }();
            float ww, cw;
            hz_candle_white(hz_render([](const HwT &t) { return HwColor{hz_candles_lvl(t, me), 0, 0, 0, 0}; }).r, ww, cw);
            out_white(id(accent_light), id(red_output), id(green_output), id(blue_output),
                      id(warm_output), id(cold_output), ww, cw);
      # The candles, quieter, with a swell travelling the row and back.
      - lambda:
          name: "Halloween - 2D Candle Chase"
          update_interval: 40ms
          lambda: |-
            static const HzSelf me = [] {
