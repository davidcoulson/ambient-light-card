            HwColor c = hz_render([](const HwT &t) { return hz_search(t, me); });
            out_rgb(id(accent_light), id(red_output), id(green_output), id(blue_output), c.r, c.g, c.b);
      # A ghost appears somewhere every 5 s and a ring of cold light races out from it.
      - lambda:
          name: "Halloween - 2D Haunting"
          update_interval: 40ms
          lambda: |-
            static const HzSelf me = [] {
              float x, y;
              light_xy("${mac}", x, y);
              return hz_at(x, y, ROOM_ASPECT, room_self("${mac}"), "${mac}");
            }();
            HwColor c = hz_render([](const HwT &t) { return hz_haunt(t, me); });
            out_rgb(id(accent_light), id(red_output), id(green_output), id(blue_output), c.r, c.g, c.b);
      # A bank of green-white fog rolls in from a new direction every 10 s and
      # drains out the far side.
      - lambda:
          name: "Halloween - 2D Rolling Fog"
          update_interval: 50ms
          lambda: |-
            static const HzSelf me = [] {
              float x, y;
