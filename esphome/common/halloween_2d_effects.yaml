            hz_candle_white(hz_render([](const HwT &t) { return HwColor{hz_chase_lvl(t, me), 0, 0, 0, 0}; }).r, ww, cw);
            out_white(id(accent_light), id(red_output), id(green_output), id(blue_output),
                      id(warm_output), id(cold_output), ww, cw);
      # Two cold searchlight beams sweeping the room from beyond the south wall.
      - lambda:
          name: "Halloween - 2D Searchlight"
          update_interval: 40ms
          lambda: |-
            static const HzSelf me = [] {
