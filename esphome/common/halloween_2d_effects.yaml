      # Violet and green spiral arms turning slowly about a glowing eye at
      # the room's centre.
      - lambda:
          name: "Halloween - 2D Witching Vortex"
          update_interval: 50ms
          lambda: |-
            static const HzSelf me = [] {
              float x, y;
              light_xy("${mac}", x, y);
