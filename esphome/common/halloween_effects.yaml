# ---------------------------------------------------------------------------
# Halloween effects for outdoor RGBCW bulbs - a row of lights along the walk
# to the front door, rendering one scene from the shared clock.
#
# Opt in per device, next to the light's own package. Nothing changes for a
# light that does not include this file:
#
#   substitutions:
#     mac: "a1b2c3"
#     area: "Outdoors"        # one area for the whole set, so they share Speed
#     yard_light: "G2"        # this light's row in the yard map
#
#   packages:
#     light: !include common/athom-light.yaml      # or any rgbww accent_light
#     halloween:
#       url: https://github.com/davidcoulson/ambient-light-card
#       ref: <release tag>
#       files:
#         - path: esphome/common/halloween_effects.yaml
#           vars:
#             yard_map: common/my_front_yard_map.h # your copy; default is the example
#
# Needs a light with `id: accent_light` (platform: rgbww) and outputs
# red_output, green_output, blue_output, warm_output and cold_output, and the
# library's light_effects_helpers.h, which accent_light_nonaddressable_effects
# .yaml or white_effects.yaml already bring in.
#
# Every effect keeps a visible floor (a light never goes dark) and stays at or
# under 1 flash per second per light and per group; halloween_fx.h has the
# rules and tests/halloween_test.cpp checks them. The room Speed helper can
# slow these effects but not speed them up.
# ---------------------------------------------------------------------------

substitutions:
  # This light's row in the yard map. Empty (or unknown): it runs the effects
  # as a lone driveway light.
  yard_light: ""
  # The yard map: which light sits where. Point this at your own copy.
  yard_map: front_yard_map.h

esphome:
  includes:
  # Named without a directory: ESPHome looks in your config directory first,
  # then next to this file.
    - halloween_fx.h
    - ${yard_map}

light:
  - platform: rgbww
    id: !extend accent_light
    effects:
      # ------------------------------------------------------------------
      # Jack-o'-Lantern Row - carved pumpkins. A gentle flame per light
      # (floor: a dim ember) and one slow gutter every 7 s, taking turns
      # within the group.
      # ------------------------------------------------------------------
      - lambda:
          name: "Jack-o'-Lantern Row"
          update_interval: 40ms
          lambda: |-
            static const HwSelf me = hw_me("${yard_light}", "${mac}");
            hw_out(id(accent_light), id(red_output), id(green_output), id(blue_output),
                   id(warm_output), id(cold_output), hw_jack(hw_seconds(), me));

      # ------------------------------------------------------------------
      # Lightning Over the House - violet night (the floor), one white
      # strike per 11 s on every light at once; a third of them a soft
      # distant glow. The street bed peaks at 40 %.
      # ------------------------------------------------------------------
      - lambda:
          name: "Lightning Over the House"
          update_interval: 20ms
          lambda: |-
            static const HwSelf me = hw_me("${yard_light}", "${mac}");
            hw_out(id(accent_light), id(red_output), id(green_output), id(blue_output),
                   id(warm_output), id(cold_output), hw_lightning(hw_seconds(), me));

      # ------------------------------------------------------------------
      # Witch's Cauldron - poison green <-> violet drift per light, a lime
      # bubble every 4.2 s, taking turns within the group.
      # ------------------------------------------------------------------
      - lambda:
          name: "Witch's Cauldron"
          update_interval: 50ms
          lambda: |-
            static const HwSelf me = hw_me("${yard_light}", "${mac}");
            hw_out(id(accent_light), id(red_output), id(green_output), id(blue_output),
                   id(warm_output), id(cold_output), hw_cauldron(hw_seconds(), me));

      # ------------------------------------------------------------------
      # Blood Moon - moon white, then an eclipse sweeps west to east into
      # copper red and clears again; four-minute cycle.
      # ------------------------------------------------------------------
      - lambda:
          name: "Blood Moon"
          update_interval: 100ms
          lambda: |-
            static const HwSelf me = hw_me("${yard_light}", "${mac}");
            hw_out(id(accent_light), id(red_output), id(green_output), id(blue_output),
                   id(warm_output), id(cold_output), hw_moon(hw_seconds(), me));
