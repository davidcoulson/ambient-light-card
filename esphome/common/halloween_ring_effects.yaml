# ---------------------------------------------------------------------------
# Halloween effects for an addressable ring or strip - the ring counterpart of
# halloween_plain_effects.yaml (which is for lights with no pixels to place).
# Two effects, named "Halloween - ..." so they group in the effect list:
#
#   Will-o'-the-Wisp    Coven Circle
#
# Opt in per device, next to the ring's own package; a light that does not
# include this file never sees them:
#
#   packages:
#     ring: !include common/lumary-ring.yaml      # any addressable accent_light
#     halloween_ring:
#       url: https://github.com/davidcoulson/ambient-light-card
#       ref: <release tag>
#       files:
#         - esphome/common/halloween_ring_effects.yaml
#
# Needs a light with `id: accent_light` (an addressable platform, any length)
# and the library's light_effects_helpers.h and halloween_plain.h, which this
# file includes; accent_light_addressable_effects.yaml brings the first in
# too. Both are pure functions of the shared clock (fx_seconds()), so every ring
# of the room plays the same show with nothing sent between them. They write
# 8-bit values, which ESPHome gamma-corrects; the colours are held to one
# luminance. tests/run_addressable_tests.sh holds them to at most 3 flashes a
# second in any segment and over the whole strip. Speed and Intensity apply as
# to the other ring effects.
# ---------------------------------------------------------------------------

esphome:
  includes:
    - light_effects_helpers.h
    - halloween_plain.h

light:
  - platform: esp32_rmt_led_strip   # swap for your actual platform (neopixelbus, etc.)
    id: !extend accent_light
    effects:
      # ------------------------------------------------------------------
      # Will-o'-the-Wisp - a dim purple field with one soft green orb in it.
      # The orb hovers for a couple of seconds, then glides round the ring to
      # somewhere else (always the short way), 3.5 s a stop.
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Halloween - Will-o'-the-Wisp"
          update_interval: 30ms
          lambda: |-
            const double T = fx_seconds();
            const int n = it.size();
            uint32_t slot; float w;
            sync_slot(T, 3.5f, slot, w);
            float a = n * sync_random(slot, 61), d = n * sync_random(slot + 1, 61) - a;
            if (d > n * 0.5f) d -= n; else if (d < -n * 0.5f) d += n;
            float pos = a + d * hl_ease((w - 1.8f) / 1.7f);
            // Intensity: how bright the orb is, never the field.
            float pulse = (0.85f + 0.15f * sinf(sync_fold(T) * 1.9f)) * fx_calm(0.5f);
            // The field breathes a little; the orb is about two LEDs wide, more on a long strip.
            float field = 0.85f + 0.15f * sinf(sync_fold(T) * 0.5f);
            const float sigma = fmaxf(1.0f, n / 14.0f), inv = 1.0f / (2.0f * sigma * sigma);
            for (int i = 0; i < n; i++) {
              float dd = fabsf(i - pos);
              if (dd > n * 0.5f) dd = n - dd;
              float o = dd < 3.0f * sigma ? expf(-dd * dd * inv) * pulse : 0.0f;
              float r = 95.0f * field, g = 0.0f, b = 170.0f * field;
              it[i] = Color((uint8_t) (r + (60.0f - r) * o), (uint8_t) (g + (255.0f - g) * o), (uint8_t) (b + (30.0f - b) * o));
            }

      # ------------------------------------------------------------------
      # Coven Circle - the ring in three arcs, purple, green and orange,
      # turning once in 90 s, a candle flickering in each (Candle Flicker's
      # flame, hl_flame()). Neighbouring arcs blend where they meet.
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Halloween - Coven Circle"
          update_interval: 40ms
          lambda: |-
            // 8-bit colours of one luminance once ESPHome's gamma has been applied.
            static const float COL[3][3] = {{190.0f, 0.0f, 255.0f}, {40.0f, 150.0f, 20.0f}, {220.0f, 72.0f, 0.0f}};
            const double T = fx_seconds();
            const int n = it.size();
            // A flame per arc, each its own offset; a level scales an 8-bit value
            // by level^(1/2.8), which is a level in light.
            float scale[3];
            for (int k = 0; k < 3; k++) scale[k] = powf(hl_flame(T, 0.31f * k), 1.0f / 2.8f);
            const float rot = (float) fmod(T / 90.0, 1.0);
            for (int i = 0; i < n; i++) {
              float g = 3.0f * ((float) i / n - rot) - 0.5f;   // arc centres at whole numbers
              g -= 3.0f * floorf(g / 3.0f);
              int j = (int) g;
              if (j > 2) j = 2;
              float s = hl_ease((g - j - 0.3f) / 0.4f);        // a plateau, then a blend into the next
              const float *c0 = COL[j], *c1 = COL[(j + 1) % 3];
              float s0 = scale[j] * (1.0f - s), s1 = scale[(j + 1) % 3] * s;
              it[i] = Color((uint8_t) (c0[0] * s0 + c1[0] * s1), (uint8_t) (c0[1] * s0 + c1[1] * s1),
                            (uint8_t) (c0[2] * s0 + c1[2] * s1));
            }
