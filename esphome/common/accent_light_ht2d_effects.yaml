# ---------------------------------------------------------------------------
# Media-room 2D effects for the four Govee rings - the ring counterpart of
# accent_light_2d_effects.yaml in the basement.
#
# Each ring is placed from common/home_theater_map.h by MAC, and each of its 13
# LEDs samples its own point in one room-wide field, so a wave crosses the room
# AND sweeps around each ring as it passes. The field and the palettes are the
# same as the basement 2D Pacifica / Aurora (common/fx2d_render.h).
#
# Brightness is ESPHome's: it dims every addressable write through the light's
# colour correction (an effect cannot bypass it), so these pass apply_level =
# false. Intensity is pinned at normal until the room's intensity control
# exists. Output is pre-compensated for the ring's gamma so it matches the
# basement at 100 %.
# ---------------------------------------------------------------------------
substitutions:
  # The ring map: each ring's centre, rotation and direction. Point this at your
  # own copy in your config directory; the default is the example.
  ht_map: home_theater_map.h

esphome:
  includes:
  # Headers are named without a directory: ESPHome looks for them in your config
  # directory first, then next to this file - which is what makes the library
  # work both as a local copy and as a remote (git) package.
    - fx2d_render.h
    - ${ht_map}

light:
  - platform: esp32_rmt_led_strip
    id: !extend accent_light
    effects:
      # ------------------------------------------------------------------
      # Calibrate: LED 0 1 2 - LED 0 red, LED 1 green, LED 2 blue, rest off.
      # Red shows which way the ring is rotated, red -> green -> blue which
      # way its numbering runs. Fill clock0 / dir in home_theater_map.h from
      # it. Raw LED indices; independent of the map.
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Calibrate: LED 0 1 2"
          update_interval: 250ms
          lambda: |-
            for (int i = 0; i < it.size(); i++)
              it[i] = Color(0, 0, 0);
            if (it.size() > 0) it[0] = Color(255, 0, 0);
            if (it.size() > 1) it[1] = Color(0, 255, 0);
            if (it.size() > 2) it[2] = Color(0, 0, 255);

      # ------------------------------------------------------------------
      # Calibrate: north + east - validates the map. Red goes on this ring's
      # LED nearest NORTH, green on its LED nearest EAST, worked out through
      # ht_led_xy() exactly as the 2D effects place their LEDs. With a correct
      # clock0 / dir, every ring's red points at the north wall and every
      # green at the east wall. A wrong red means a wrong clock0; a wrong
      # green with the right red means a wrong dir.
      # ------------------------------------------------------------------
      - addressable_lambda:
          name: "Calibrate: north + east"
          update_interval: 250ms
          lambda: |-
            const int n = it.size() < 64 ? it.size() : 64;
            float xs[64], ys[64], cx = 0.0f, cy = 0.0f;
            for (int i = 0; i < n; i++) {
              ht_led_xy("${mac}", i, n, xs[i], ys[i]);
              cx += xs[i];
              cy += ys[i];
            }
            if (n > 0) { cx /= n; cy /= n; }
            int north = 0, east = 0;
            for (int i = 0; i < n; i++) {
              if (ys[i] - cy < ys[north] - cy) north = i;   // plan y grows southward
              if (xs[i] - cx > xs[east] - cx) east = i;
            }
            for (int i = 0; i < it.size(); i++)
              it[i] = Color(0, 0, 0);
            if (n > 0) {
              it[north] = Color(255, 0, 0);
              it[east] = Color(0, 255, 0);
            }

      - addressable_lambda:
          name: "2D Pacifica"
          update_interval: 50ms
          lambda: |-
            static const uint8_t PD[16][3] = {
              {0,2,8},{0,3,12},{0,4,16},{0,6,21},
              {0,8,27},{0,10,33},{0,13,40},{0,16,48},
              {0,20,57},{0,24,66},{0,29,76},{0,34,86},
              {0,40,97},{2,47,108},{6,55,120},{12,64,132}
            };
            static const uint8_t PM[16][3] = {
              {0,6,8},{0,10,13},{0,15,19},{0,21,26},
              {0,28,34},{0,36,43},{2,45,53},{4,55,63},
              {8,66,74},{14,78,86},{22,91,98},{32,105,111},
              {44,120,124},{58,135,138},{74,150,152},{92,166,166}
            };
            static const uint8_t PB[16][3] = {
              {10,40,50},{20,70,82},{34,100,112},{50,128,140},
              {70,154,164},{94,176,184},{118,194,200},{142,208,212},
              {164,220,222},{184,230,231},{200,237,238},{214,242,243},
              {226,246,247},{236,250,250},{246,253,253},{255,255,255}
            };
            // One room-wide field; each of this ring's LEDs samples its own point.
            const double T = fx_seconds();
            const float I = fx_intensity();
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              float px, py, r, g, b;
              ht_led_xy("${mac}", i, n, px, py);
              pacifica2d(px, py, T, I, 0.70f, 1.0f, PD, PM, PB, r, g, b, false);
              uint8_t R, G, B;
              ht_ring_rgb8(id(accent_light), r, g, b, R, G, B);
              it[i] = Color(R, G, B);
            }

